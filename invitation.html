<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Royal Wedding Invitation | Ashish & Aarti</title>
  
  <!-- Google Fonts: Royal serif, devanagari script, & modern luxury styling -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700;800&family=Rozha+One&family=Yatra+One&family=Montserrat:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">

  <style>
    /* -------------------------------------------------------------
       1. ROOT COLOR PALETTE & RESET
       ------------------------------------------------------------- */
    :root {
      --gold-deep: #9d7827;
      --gold-primary: #d4af37;
      --gold-light: #fff2a3;
      --gold-spark: #ffe57f;
      --maroon-dark: #2d040a;
      --maroon-rich: #480611;
      --maroon-velvet: #630818;
      --wood-dark: #1f0b07;
      --wood-panel: #33150d;
      --wood-highlight: #4a2114;
      --parchment: #fdfaf3;
      --cream: #fbf6ec;
      --shadow-lux: 0 15px 35px rgba(0, 0, 0, 0.45);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--maroon-dark);
      color: #3b2818;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
    }

    body.locked {
      overflow: hidden;
    }

    /* Ambient Canvas for Golden Particles */
    #ambient-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 40;
    }

    /* -------------------------------------------------------------
       2. ROYAL WEDDING DOORS (3D PERSPECTIVE)
       ------------------------------------------------------------- */
    #door-curtain {
      position: fixed;
      inset: 0;
      z-index: 100;
      perspective: 1800px;
      perspective-origin: center center;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: radial-gradient(circle, #2a0307 0%, #0d0102 100%);
      cursor: pointer;
      transition: visibility 2.8s ease;
    }

    #door-curtain.hidden {
      visibility: hidden;
      pointer-events: none;
    }

    /* Golden back-glow during door opening */
    .door-burst-light {
      position: absolute;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, rgba(255, 235, 150, 0.95) 0%, rgba(212, 175, 55, 0.6) 35%, rgba(45, 4, 10, 0) 75%);
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 2s cubic-bezier(0.2, 0.8, 0.2, 1), transform 2.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 1;
      pointer-events: none;
    }

    #door-curtain.opening .door-burst-light {
      opacity: 1;
      transform: scale(1.6);
    }

    /* Toran Garland at Archway */
    .toran-frieze {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 95px;
      z-index: 10;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding: 0 10px;
      pointer-events: none;
    }

    .marigold-swag {
      width: 100%;
      height: 60px;
      background-image: radial-gradient(circle at 10px 10px, #ff9900 3px, #e65c00 6px, transparent 7px),
                        radial-gradient(circle at 25px 25px, #ffc107 4px, #ff9800 7px, transparent 8px);
      background-size: 35px 35px;
      mask-image: radial-gradient(ellipse at 50% 0%, black 65%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 0%, black 65%, transparent 70%);
      border-bottom: 2px dashed rgba(255, 215, 0, 0.4);
    }

    .door-wrapper {
      position: absolute;
      inset: 0;
      display: flex;
      width: 100%;
      height: 100%;
      z-index: 5;
    }

    .door-leaf {
      width: 50%;
      height: 100%;
      position: relative;
      background:
        radial-gradient(ellipse at center, rgba(74, 33, 20, 0.5) 0%, rgba(31, 11, 7, 0.95) 100%),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, rgba(0,0,0,0.06) 8px, transparent 16px),
        linear-gradient(180deg, #180704 0%, #2f120a 50%, #150603 100%);
      border: 8px solid #33150d;
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.95);
      transition: transform 2.4s cubic-bezier(0.65, 0, 0.25, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      padding: 50px 20px;
      backface-visibility: hidden;
    }

    .door-leaf.left {
      transform-origin: left center;
      border-right: 3px solid var(--gold-deep);
      box-shadow: inset -10px 0 30px rgba(0,0,0,0.8);
    }

    .door-leaf.right {
      transform-origin: right center;
      border-left: 3px solid var(--gold-deep);
      box-shadow: inset 10px 0 30px rgba(0,0,0,0.8);
    }

    #door-curtain.opening .door-leaf.left {
      transform: rotateY(-112deg);
    }

    #door-curtain.opening .door-leaf.right {
      transform: rotateY(112deg);
    }

    /* Traditional Indian Wood-Carving Panels */
    .wood-panel {
      width: 82%;
      height: 25%;
      border: 2px solid var(--gold-deep);
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(74, 33, 20, 0.8), rgba(20, 7, 4, 0.95));
      position: relative;
      box-shadow: inset 0 0 18px rgba(0,0,0,0.9), 0 0 12px rgba(212, 175, 55, 0.15);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wood-panel::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px dashed rgba(212, 175, 55, 0.45);
      border-radius: 4px;
    }

    /* Filigree Brass Mandala Emblem in Panels */
    .brass-mandala {
      width: 68px;
      height: 68px;
      border: 2px solid var(--gold-primary);
      border-radius: 50%;
      position: relative;
      opacity: 0.85;
      box-shadow: 0 0 14px rgba(212, 175, 55, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brass-mandala::after {
      content: "";
      width: 44px;
      height: 44px;
      border: 1px solid var(--gold-light);
      transform: rotate(45deg);
    }

    /* Central Royal Brass Handles */
    .door-handle-assembly {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 72px;
      height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 12;
    }

    .door-leaf.left .door-handle-assembly { right: 8px; }
    .door-leaf.right .door-handle-assembly { left: 8px; }

    .brass-plate {
      width: 38px;
      height: 130px;
      background: linear-gradient(135deg, #c59f33 0%, #fae188 50%, #876218 100%);
      border-radius: 19px;
      box-shadow: 0 0 20px rgba(0,0,0,0.85), inset 0 0 6px rgba(255,255,255,0.7);
      border: 2px solid #573a06;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
    }

    .brass-knocker-ring {
      width: 48px;
      height: 48px;
      border: 7px solid #deb842;
      border-radius: 50%;
      box-shadow: 0 8px 16px rgba(0,0,0,0.7), inset 0 2px 4px rgba(255,255,255,0.6);
      transform: translateY(6px);
      background: radial-gradient(circle, transparent 40%, rgba(68, 47, 9, 0.5) 100%);
    }

    /* Center prompt: "Tap to Open" */
    .door-prompt {
      position: absolute;
      bottom: 12%;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      text-align: center;
      transition: opacity 0.8s ease;
    }

    #door-curtain.opening .door-prompt {
      opacity: 0;
    }

    .prompt-gold-badge {
      background: rgba(22, 4, 7, 0.85);
      border: 1px solid var(--gold-primary);
      padding: 14px 28px;
      border-radius: 50px;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.5), inset 0 0 10px rgba(212, 175, 55, 0.2);
      backdrop-filter: blur(8px);
      animation: pulseGlow 2.4s infinite ease-in-out;
    }

    .prompt-text {
      font-family: 'Cinzel', serif;
      font-size: 15px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--gold-light);
      font-weight: 700;
      text-shadow: 0 0 12px rgba(255, 235, 120, 0.8);
    }

    .prompt-sub {
      font-family: 'Yatra One', cursive;
      font-size: 13px;
      color: #ffd88a;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.4), inset 0 0 8px rgba(212, 175, 55, 0.2);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 0 35px rgba(212, 175, 55, 0.8), inset 0 0 15px rgba(212, 175, 55, 0.4);
      }
    }

    /* -------------------------------------------------------------
       3. FLOATING MUSIC CONTROLLER
       ------------------------------------------------------------- */
    #music-control {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 90;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(30, 3, 7, 0.85);
      border: 1.5px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-light);
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0,0,0,0.5), 0 0 12px rgba(212, 175, 55, 0.35);
      backdrop-filter: blur(5px);
      transition: all 0.35s ease;
      opacity: 0;
      visibility: hidden;
    }

    #music-control.visible {
      opacity: 1;
      visibility: visible;
    }

    #music-control:hover {
      transform: scale(1.08);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.7);
    }

    .music-waves {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 18px;
    }

    .wave-bar {
      width: 3px;
      background: var(--gold-light);
      border-radius: 2px;
      height: 4px;
      transition: height 0.2s ease;
    }

    .playing .wave-bar:nth-child(1) { animation: soundBar 1s infinite alternate 0.1s; }
    .playing .wave-bar:nth-child(2) { animation: soundBar 1.2s infinite alternate 0.3s; }
    .playing .wave-bar:nth-child(3) { animation: soundBar 0.8s infinite alternate 0.2s; }
    .playing .wave-bar:nth-child(4) { animation: soundBar 1.1s infinite alternate 0.4s; }

    @keyframes soundBar {
      0% { height: 4px; }
      100% { height: 17px; }
    }

    /* -------------------------------------------------------------
       4. ROYAL INVITATION STAGE & CANVAS
       ------------------------------------------------------------- */
    #invitation-stage {
      min-height: 100vh;
      width: 100%;
      background:
        radial-gradient(circle at 50% 10%, rgba(99, 8, 24, 0.6) 0%, rgba(20, 2, 5, 0.95) 75%),
        radial-gradient(circle at center, #35040b 0%, #150103 100%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 16px 80px;
      position: relative;
    }

    /* Seamless Golden Traditional Mandap Frame */
    .royal-scroll-sheet {
      width: 100%;
      max-width: 660px;
      background:
        radial-gradient(ellipse at top, #fffdf8 0%, #fbf3e2 70%, #f5e7c8 100%);
      border-radius: 18px;
      padding: 48px 24px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.85),
        0 0 0 1px rgba(212, 175, 55, 0.5),
        inset 0 0 45px rgba(212, 175, 55, 0.18);
      position: relative;
      text-align: center;
      border: 3px solid #d4af37;
      margin: auto 0;
    }

    /* Intricate Ornamental Border Inset */
    .ornate-border-inner {
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(157, 120, 39, 0.45);
      border-radius: 12px;
      pointer-events: none;
    }

    .corner-motif {
      position: absolute;
      width: 32px;
      height: 32px;
      pointer-events: none;
      color: var(--gold-deep);
    }
    .corner-motif.tl { top: 6px; left: 6px; }
    .corner-motif.tr { top: 6px; right: 6px; transform: rotate(90deg); }
    .corner-motif.br { bottom: 6px; right: 6px; transform: rotate(180deg); }
    .corner-motif.bl { bottom: 6px; left: 6px; transform: rotate(270deg); }

    /* -------------------------------------------------------------
       5. LORD GANESHA SECTION
       ------------------------------------------------------------- */
    .ganesha-wrapper {
      position: relative;
      margin: 0 auto 20px;
      display: inline-block;
    }

    .ganesha-halo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 155px;
      height: 155px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 225, 120, 0.8) 0%, rgba(212, 175, 55, 0.25) 55%, transparent 75%);
      filter: blur(10px);
      animation: divineGlow 3.5s infinite alternate ease-in-out;
      z-index: 1;
    }

    @keyframes divineGlow {
      0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.9); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    }

    .ganesha-svg-container {
      position: relative;
      z-index: 2;
      width: 120px;
      height: 120px;
      margin: 0 auto;
      filter: drop-shadow(0 6px 12px rgba(120, 80, 10, 0.35));
      animation: gentleFloat 4s ease-in-out infinite alternate;
    }

    @keyframes gentleFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-7px); }
    }

    .auspicious-mantra-title {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--maroon-rich);
      font-weight: 700;
      margin-top: 10px;
      position: relative;
      display: inline-block;
    }

    .auspicious-mantra-title::before,
    .auspicious-mantra-title::after {
      content: "◆";
      font-size: 8px;
      color: var(--gold-primary);
      margin: 0 10px;
      vertical-align: middle;
    }

    /* Sacred Shlok Block */
    .shlok-card {
      position: relative;
      margin: 18px auto 26px;
      padding: 16px 20px;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 8px;
      border-left: 2px solid var(--gold-primary);
      border-right: 2px solid var(--gold-primary);
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.12);
    }

    .sanskrit-shlok {
      font-family: 'Rozha One', 'Yatra One', serif;
      color: var(--maroon-velvet);
      font-size: 17.5px;
      line-height: 1.85;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.8);
      letter-spacing: 0.5px;
    }

    /* Divider */
    .royal-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 26px auto;
      max-width: 320px;
      color: var(--gold-deep);
    }

    .royal-divider .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
    }

    /* -------------------------------------------------------------
       6. BRIDE & GROOM CELEBRATION SECTION
       ------------------------------------------------------------- */
    .intro-subtext {
      font-family: 'Cinzel', serif;
      font-size: 13.5px;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: #6d4e28;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .couple-layout {
      position: relative;
      margin: 20px 0 10px;
    }

    .profile-card {
      margin: 8px 0;
      position: relative;
    }

    .name-title {
      font-family: 'Cinzel Decorative', 'Cinzel', serif;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 4px;
      line-height: 1.15;
      background: linear-gradient(135deg, #4d0a15 0%, #870f23 50%, #40050e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 3px rgba(120, 20, 30, 0.15));
      text-transform: uppercase;
    }

    .family-lineage {
      font-size: 13.5px;
      color: #573a21;
      font-weight: 500;
      margin-top: 6px;
      font-style: italic;
      letter-spacing: 0.6px;
    }

    .family-lineage strong {
      color: var(--maroon-rich);
      font-weight: 600;
      font-style: normal;
    }

    /* Romantic Center Knot/Heart */
    .sacred-knot {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 18px 0;
    }

    .knot-symbol {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fff7dc 0%, #fed876 100%);
      border: 1.5px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--maroon-velvet);
      font-size: 18px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
      position: relative;
      animation: heartbeat 2s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.15); }
      28% { transform: scale(1); }
      42% { transform: scale(1.1); }
      70% { transform: scale(1); }
    }

    .solitary-shubh {
      font-family: 'Rozha One', serif;
      font-size: 12px;
      color: var(--gold-deep);
      margin-top: 4px;
      letter-spacing: 1.5px;
    }

    /* Responsive Adaptation for Tablets & Desktops */
    @media (min-width: 600px) {
      .royal-scroll-sheet {
        padding: 58px 46px;
      }

      .name-title {
        font-size: 44px;
        letter-spacing: 5px;
      }

      .sanskrit-shlok {
        font-size: 20px;
      }

      .wood-panel {
        height: 27%;
      }
    }

    @media (max-width: 400px) {
      .name-title {
        font-size: 29px;
      }
      .sanskrit-shlok {
        font-size: 16px;
      }
    }
  </style>
</head>

<body class="locked">

  <!-- Ambient Golden Sparkle Canvas -->
  <canvas id="ambient-particles"></canvas>

  <!-- Floating Audio Player Control -->
  <div id="music-control" aria-label="Toggle Music" title="Audio Control">
    <div class="music-waves">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
  </div>

  <!-- Audio Element with Robust Graceful Fallback Placeholder -->
  <audio id="wedding-audio" loop preload="auto">
    <!-- Replace 'wedding-song.mp3' with your actual audio track URL -->
    <source src="wedding-song.mp3" type="audio/mpeg">
  </audio>

  <!-- -----------------------------------------------------------
       SECTION 1: ROYAL WEDDING DOORS (3D PERSPECTIVE)
       ----------------------------------------------------------- -->
  <div id="door-curtain" role="button" aria-label="Click to open the wedding invitation">
    
    <!-- Cinematic Backlight burst on open -->
    <div class="door-burst-light"></div>

    <!-- Festive Traditional Floral Arch (Toran) -->
    <div class="toran-frieze">
      <div class="marigold-swag"></div>
      <div class="marigold-swag"></div>
    </div>

    <!-- The Dual Grand Doors -->
    <div class="door-wrapper">
      
      <!-- Left Door -->
      <div class="door-leaf left">
        <div class="wood-panel">
          <div class="brass-mandala"></div>
        </div>
        <div class="wood-panel">
          <div class="brass-mandala"></div>
        </div>
        <div class="wood-panel">
          <div class="brass-mandala"></div>
        </div>

        <!-- Left Handle Assembly -->
        <div class="door-handle-assembly">
          <div class="brass-plate">
            <div class="brass-knocker-ring"></div>
          </div>
        </div>
      </div>

      <!-- Right Door -->
      <div class="door-leaf right">
        <div class="wood-panel">
          <div class="brass-mandala"></div>
        </div>
        <div class="wood-panel">
          <div class="brass-mandala"></div>
        </div>
        <div class="wood-panel">
          <div class="brass-mandala"></div>
        </div>

        <!-- Right Handle Assembly -->
        <div class="door-handle-assembly">
          <div class="brass-plate">
            <div class="brass-knocker-ring"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- Tap to Open Badge -->
    <div class="door-prompt">
      <div class="prompt-gold-badge">
        <div class="prompt-text">Tap to Open</div>
        <div class="prompt-sub">॥ मंगलम् भगवान विष्णुः ॥</div>
      </div>
    </div>

  </div>

  <!-- -----------------------------------------------------------
       SECTION 2: INVITATION MAIN STAGE
       ----------------------------------------------------------- -->
  <main id="invitation-stage">
    
    <div class="royal-scroll-sheet">
      
      <!-- Ornate Border Linework -->
      <div class="ornate-border-inner"></div>
      
      <!-- Corner Filigree Vectors -->
      <svg class="corner-motif tl" viewBox="0 0 100 100" fill="currentColor">
        <path d="M10,10 L70,10 C60,20 40,40 40,70 L40,40 L10,40 Z M15,15 L15,30 C25,30 30,25 30,15 Z" />
      </svg>
      <svg class="corner-motif tr" viewBox="0 0 100 100" fill="currentColor">
        <path d="M10,10 L70,10 C60,20 40,40 40,70 L40,40 L10,40 Z M15,15 L15,30 C25,30 30,25 30,15 Z" />
      </svg>
      <svg class="corner-motif br" viewBox="0 0 100 100" fill="currentColor">
        <path d="M10,10 L70,10 C60,20 40,40 40,70 L40,40 L10,40 Z M15,15 L15,30 C25,30 30,25 30,15 Z" />
      </svg>
      <svg class="corner-motif bl" viewBox="0 0 100 100" fill="currentColor">
        <path d="M10,10 L70,10 C60,20 40,40 40,70 L40,40 L10,40 Z M15,15 L15,30 C25,30 30,25 30,15 Z" />
      </svg>

      <!-- -------------------------------------------------------

  <!-- -----------------------------------------------------------
       7. JAVASCRIPT: LOGIC, PARTICLES, DOOR 3D INTERACTION & AUDIO
       ----------------------------------------------------------- -->
  <script>
    (function () {
      'use strict';

      /* --- Elements Cache --- */
      const doorCurtain = document.getElementById('door-curtain');
      const weddingAudio = document.getElementById('wedding-audio');
      const musicControl = document.getElementById('music-control');
      const canvas = document.getElementById('ambient-particles');
      const ctx = canvas.getContext('2d');
      const body = document.body;

      let isAudioPlaying = false;
      let doorsOpened = false;

      /* -----------------------------------------------------------
         AUDIO SYSTEM: Fail-Safe Web Audio Synthesizer Fallback
         If 'wedding-song.mp3' doesn't exist locally, it generates
         a subtle, divine Indian Tanpura / meditative drone chord.
         ----------------------------------------------------------- */
      let audioCtx = null;
      let synthInterval = null;

      function playSyntheticShehnaiAmbience() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          if (!audioCtx) audioCtx = new AudioContext();
          if (audioCtx.state === 'suspended') audioCtx.resume();

          // Meditative Indian Santoor/Drone Frequencies (Sa - Pa harmonic chords)
          const notes = [220, 277.18, 329.63, 440, 554.37, 659.25];
          
          function triggerPluck(freq, delay) {
            setTimeout(() => {
              if (!isAudioPlaying) return;
              try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3.8);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 4.0);
              } catch (e) {
                // Silently handle context boundary
              }
            }, delay);
          }

          function cycleArpeggio() {
            if (!isAudioPlaying) return;
            notes.forEach((freq, idx) => {
              triggerPluck(freq, idx * 600);
            });
          }

          cycleArpeggio();
          synthInterval = setInterval(cycleArpeggio, 4200);
        } catch (err) {
          console.warn('Web Audio synthesis unassisted');
        }
      }

      function stopSyntheticAudio() {
        if (synthInterval) {
          clearInterval(synthInterval);
          synthInterval = null;
        }
        if (audioCtx && audioCtx.state === 'running') {
          audioCtx.suspend();
        }
      }

      function startAudio() {
        weddingAudio.volume = 0.75;
        const playPromise = weddingAudio.play();

        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              isAudioPlaying = true;
              musicControl.classList.add('playing');
            })
            .catch(() => {
              // File not found or blocked: Fall back gracefully to synthesized ambient drone
              isAudioPlaying = true;
              musicControl.classList.add('playing');
              playSyntheticShehnaiAmbience();
            });
        }
      }

      function toggleAudio() {
        if (isAudioPlaying) {
          weddingAudio.pause();
          stopSyntheticAudio();
          isAudioPlaying = false;
          musicControl.classList.remove('playing');
        } else {
          startAudio();
        }
      }

      musicControl.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleAudio();
      });

      /* -----------------------------------------------------------
         DOOR INTERACTION: Seamless 3D Door Open & Transitions
         ----------------------------------------------------------- */
      function openRoyalDoors() {
        if (doorsOpened) return;
        doorsOpened = true;

        // Unlock scroll after slight cinematic pause
        setTimeout(() => {
          body.classList.remove('locked');
        }, 1200);

        // Initiate opening animation
        doorCurtain.classList.add('opening');

        // Play wedding music automatically as a result of user tap
        startAudio();

        // Reveal Floating Music Controller
        setTimeout(() => {
          musicControl.classList.add('visible');
        }, 1500);

        // Remove doors from viewport flow after complete swing
        setTimeout(() => {
          doorCurtain.classList.add('hidden');
        }, 2600);
      }

      doorCurtain.addEventListener('click', openRoyalDoors);
      doorCurtain.addEventListener('touchstart', openRoyalDoors, { passive: true });

      /* -----------------------------------------------------------
         PARTICLE SYSTEM: Subtle, Golden Shimmer & Dust Effect
         ----------------------------------------------------------- */
      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particleCount = 45;
      const particles = [];

      class GoldenParticle {
        constructor() {
          this.reset(true);
        }

        reset(initial = false) {
          this.x = Math.random() * width;
          this.y = initial ? Math.random() * height : height + 15;
          this.size = Math.random() * 2.8 + 1;
          this.speedY = Math.random() * 0.7 + 0.25;
          this.speedX = (Math.random() - 0.5) * 0.45;
          this.alpha = Math.random() * 0.65 + 0.25;
          this.glowSpeed = Math.random() * 0.02 + 0.008;
          this.glowAngle = Math.random() * Math.PI * 2;
        }

        update() {
          this.y -= this.speedY;
          this.x += this.speedX;
          this.glowAngle += this.glowSpeed;

          // Flicker luminosity gently
          this.currentAlpha = this.alpha + Math.sin(this.glowAngle) * 0.22;
          if (this.currentAlpha < 0.1) this.currentAlpha = 0.1;

          // Wrap boundaries
          if (this.y < -20 || this.x < -20 || this.x > width + 20) {
            this.reset(false);
          }
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 228, 130, ${this.currentAlpha})`;
          ctx.shadowBlur = 8;
          ctx.shadowColor = '#d4af37';
          ctx.fill();
          ctx.shadowBlur = 0; // reset for performance
        }
      }

      for (let i = 0; i < particleCount; i++) {
        particles.push(new GoldenParticle());
      }

      function animateParticles() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw();
        }
        requestAnimationFrame(animateParticles);
      }

      animateParticles();

    })();
  </script>
