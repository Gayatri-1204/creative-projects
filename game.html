<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Romance RPG 🎮❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #1e123a 0%, #0d081f 65%, #05030e 100%);
      min-height: 100vh;
      width: 100vw;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Pixel CRT Glows */
    .arcade-glow-1 {
      position: absolute;
      top: -10%;
      left: 20%;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.18), transparent 70%);
      filter: blur(100px);
      pointer-events: none;
    }

    .arcade-glow-2 {
      position: absolute;
      bottom: -15%;
      right: 20%;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.2), transparent 70%);
      filter: blur(100px);
      pointer-events: none;
    }

    .game-console {
      width: 100%;
      max-width: 480px;
      background: #181329;
      border: 6px solid #ff4d6d;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 77, 109, 0.35);
      position: relative;
      z-index: 10;
      margin: 15px;
    }

    /* CRT Scanline Overlay */
    .screen-bezel {
      background: #090614;
      border: 4px solid #3b2d54;
      border-radius: 12px;
      padding: 20px 14px;
      position: relative;
      overflow: hidden;
      min-height: 480px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .screen-bezel::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 20;
      pointer-events: none;
    }

    .stage-view {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      z-index: 5;
    }

    .stage-view.active {
      display: flex;
    }

    /* -----------------------------
       STAGE 1: START TITLE
    ----------------------------- */
    .game-tag {
      font-size: 0.65rem;
      color: #38bdf8;
      letter-spacing: 2px;
      margin-bottom: 12px;
      text-align: center;
    }

    .game-title {
      font-size: 1.25rem;
      color: #ff4d6d;
      text-shadow: 3px 3px 0px #fff;
      line-height: 1.5;
      text-align: center;
      margin-bottom: 25px;
    }

    .pixel-art-box {
      width: 130px;
      height: 130px;
      background: #1e1738;
      border: 4px dashed #ff4d6d;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3.5rem;
      animation: bouncePixel 1s infinite alternate;
      margin-bottom: 30px;
    }

    @keyframes bouncePixel {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }

    .press-start-btn {
      background: #ff4d6d;
      color: #fff;
      border: 4px solid #fff;
      padding: 14px 20px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.75rem;
      cursor: pointer;
      box-shadow: 4px 4px 0px #800f2f;
      animation: blinkText 0.8s infinite alternate;
      margin-top: 15px;
    }

    @keyframes blinkText {
      0% { opacity: 0.8; }
      100% { opacity: 1; transform: scale(1.04); }
    }

    /* -----------------------------
       STAGE 2: BATTLE SCREEN
    ----------------------------- */
    .battle-hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed #4ade80;
      padding-bottom: 10px;
      margin-bottom: 15px;
      font-size: 0.65rem;
      color: #4ade80;
    }

    .hp-bar-outer {
      width: 110px;
      height: 12px;
      border: 2px solid #fff;
      background: #222;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }

    .hp-bar-inner {
      width: 100%;
      height: 100%;
      background: #4ade80;
      transition: width 0.4s ease;
    }

    .enemy-sprite-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 15px 0;
    }

    .enemy-sprite {
      font-size: 4rem;
      filter: drop-shadow(0 0 10px rgba(255, 77, 109, 0.5));
      animation: spriteWiggle 2s infinite ease-in-out;
    }

    @keyframes spriteWiggle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    .enemy-name {
      font-size: 0.7rem;
      color: #fef08a;
      margin-top: 8px;
    }

    /* Dialog Textbox */
    .rpg-dialog-box {
      width: 100%;
      background: #110d21;
      border: 3px solid #fff;
      border-radius: 8px;
      padding: 12px;
      min-height: 70px;
      font-family: 'VT323', monospace;
      font-size: 1.3rem;
      line-height: 1.3;
      color: #e2e8f0;
      margin-bottom: 15px;
      text-align: left;
    }

    /* 2x2 Battle Command Matrix */
    .command-matrix {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .cmd-btn {
      background: #251c3d;
      border: 2px solid #a855f7;
      color: #fff;
      padding: 12px 6px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      cursor: pointer;
      text-align: center;
      transition: background 0.1s;
    }

    .cmd-btn:hover {
      background: #a855f7;
      color: #000;
      border-color: #fff;
    }

    /* -----------------------------
       STAGE 3: VICTORY SCREEN
    ----------------------------- */
    .victory-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px 0;
    }

    .victory-badge {
      font-size: 4rem;
      margin-bottom: 15px;
      animation: floatTrophy 1.5s infinite alternate ease-in-out;
    }

    @keyframes floatTrophy {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }

    .victory-title {
      font-size: 1rem;
      color: #facc15;
      text-shadow: 2px 2px 0px #854d0e;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .victory-story {
      font-family: 'VT323', monospace;
      font-size: 1.35rem;
      line-height: 1.4;
      color: #f1f5f9;
      margin-bottom: 25px;
      background: #110d21;
      padding: 12px;
      border: 2px dashed #facc15;
      border-radius: 8px;
    }

    .btn-replay-game {
      background: #4ade80;
      color: #000;
      border: 3px solid #fff;
      padding: 12px 24px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      cursor: pointer;
      box-shadow: 3px 3px 0px #166534;
    }

    .btn-replay-game:hover {
      background: #22c55e;
      transform: scale(1.05);
    }

    /* Pixel Floating Sparkles */
    .pixel-fx {
      position: absolute;
      font-size: 1.4rem;
      pointer-events: none;
      animation: pixelFly 1.2s ease-out forwards;
      z-index: 100;
    }

    @keyframes pixelFly {
      0% { opacity: 1; transform: translate(0, 0) scale(0.6); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.4); }
    }
  </style>
</head>
<body>

  <div class="arcade-glow-1"></div>
  <div class="arcade-glow-2"></div>

  <div class="game-console">
    <div class="screen-bezel">

      <!-- 1. INTRO / START SCREEN -->
      <div id="viewStart" class="stage-view active">
        <div>
          <div class="game-tag">★ WORLD 1 - STAGE LOVE ★</div>
          <h1 class="game-title">ROMANCE QUEST</h1>
        </div>

        <div class="pixel-art-box">👾❤️</div>

        <div>
          <button class="press-start-btn" onclick="startBattle()">PRESS START</button>
        </div>
      </div>

      <!-- 2. BATTLE SYSTEM VIEW -->
      <div id="viewBattle" class="stage-view">
        <div class="battle-hud">
          <div>
            <div>MY BOYFRIEND</div>
            <div class="hp-bar-outer"><div id="enemyHp" class="hp-bar-inner"></div></div>
          </div>
          <div>LOVE LVL 99</div>
        </div>

        <div class="enemy-sprite-stage">
          <div id="battleSprite" class="enemy-sprite">🥺👉👈</div>
          <div class="enemy-name">WILD SOULMATE</div>
        </div>

        <div id="dialogText" class="rpg-dialog-box">
          A wild handsome boyfriend appeared! What will you do?
        </div>

        <div class="command-matrix">
          <button class="cmd-btn" onclick="takeAction('hug')">▶ HUG TIGHT</button>
          <button class="cmd-btn" onclick="takeAction('kiss')">▶ ATTACK: KISS</button>
          <button class="cmd-btn" onclick="takeAction('choco')">▶ ITEM: CHOCO</button>
          <button class="cmd-btn" onclick="takeAction('heart')">▶ STEAL HEART</button>
        </div>
      </div>

      <!-- 3. VICTORY VICTORY SCREEN -->
      <div id="viewVictory" class="stage-view">
        <div class="victory-box">
          <div class="victory-badge">🏆✨</div>
          <div class="victory-title">ACHIEVEMENT UNLOCKED!</div>

          <div class="victory-story">
            "Target defeated with extreme cuteness! You captured his heart permanently. No refunds, you are stuck with him forever!" ❤️️
          </div>

          <button class="btn-replay-game" onclick="restartRPG()">PLAY AGAIN 🔁</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    let lovePower = 100;
    let turnCount = 0;

    function switchView(viewId) {
      document.querySelectorAll('.stage-view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    function startBattle() {
      lovePower = 100;
      turnCount = 0;
      document.getElementById('enemyHp').style.width = '100%';
      document.getElementById('battleSprite').innerText = '🥺👉👈';
      document.getElementById('dialogText').innerText = 'A wild handsome boyfriend appeared! What will you do?';
      switchView('viewBattle');
    }

    function takeAction(type) {
      const dialog = document.getElementById('dialogText');
      const sprite = document.getElementById('battleSprite');
      turnCount++;

      if (type === 'hug') {
        dialog.innerText = 'You wrapped him in the tightest hug! His defenses melted away! Critical Hit! +9999 Love!';
        sprite.innerText = '🥰';
        burstPixelArt('❤️');
      } else if (type === 'kiss') {
        dialog.innerText = 'Surprise Kiss landed right on his cheeks! He is completely flustered and blushing!';
        sprite.innerText = '😳💋';
        burstPixelArt('💋');
      } else if (type === 'choco') {
        dialog.innerText = 'You fed him sweet chocolates! Sweetness overload! Happiness bar maximized!';
        sprite.innerText = '😋🍫';
        burstPixelArt('🍫');
      } else if (type === 'heart') {
        dialog.innerText = 'You stole his whole heart! He surrendered immediately!';
        sprite.innerText = '💖😍';
        burstPixelArt('✨');
      }

      // Reduce HP to trigger victory
      lovePower -= 35;
      document.getElementById('enemyHp').style.width = Math.max(0, lovePower) + '%';

      if (lovePower <= 0 || turnCount >= 3) {
        setTimeout(() => {
          switchView('viewVictory');
        }, 1400);
      }
    }

    function restartRPG() {
      switchView('viewStart');
    }

    function burstPixelArt(emoji) {
      const bezel = document.querySelector('.screen-bezel');
      for (let i = 0; i < 15; i++) {
        const item = document.createElement('div');
        item.className = 'pixel-fx';
        item.innerText = emoji;
        item.style.left = '50%';
        item.style.top = '40%';

        const dx = (Math.random() - 0.5) * 260 + 'px';
        const dy = (Math.random() - 0.5) * 200 + 'px';
        item.style.setProperty('--dx', dx);
        item.style.setProperty('--dy', dy);

        bezel.appendChild(item);
        setTimeout(() => item.remove(), 1200);
      }
    }
  </script>
</body>
</html>
