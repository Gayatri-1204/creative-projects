<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Are You Mad At Me? 🥺</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #2e0914 0%, #140207 70%, #080003 100%);
      min-height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      color: #fff;
      position: relative;
    }

    .ambient-glow {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(255, 77, 109, 0.25), transparent 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    .main-box {
      width: 100%;
      max-width: 460px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 10;
    }

    /* Cartoon Card */
    .character-card {
      width: clamp(230px, 30vw, 300px);
      background: #ffffff;
      padding: 18px 18px 24px 18px;
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7), 0 0 35px rgba(255, 77, 109, 0.35);
      border: 3px solid rgba(255, 117, 143, 0.4);
      margin-bottom: 25px;
      transition: all 0.4s ease;
    }

    .character-stage {
      width: 100%;
      height: clamp(170px, 22vw, 210px);
      background: #fff0f3;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Pouty Angry Cat SVG */
    #angrySvg {
      display: block;
      animation: angryPout 2.5s ease-in-out infinite alternate;
    }

    @keyframes angryPout {
      0% { transform: scale(1) translateY(0); }
      100% { transform: scale(1.03) translateY(-4px); }
    }

    /* Happy Cat SVG */
    #happySvg {
      display: none;
      animation: happyBounce 0.5s ease-in-out infinite alternate;
    }

    @keyframes happyBounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-12px); }
    }

    .question-title {
      font-family: 'Fredoka', cursive;
      font-size: clamp(1.8rem, 3.2vw, 2.5rem);
      color: #ffe5ec;
      text-shadow: 0 4px 15px rgba(255, 77, 109, 0.6);
      margin-bottom: 30px;
    }

    /* Buttons Arena */
    .button-arena {
      display: flex;
      gap: 30px;
      align-items: center;
      justify-content: center;
      width: 320px;
      height: 75px;
      position: relative;
    }

    .btn-no {
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      color: white;
      border: none;
      padding: 12px 36px;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 77, 109, 0.5);
      transition: transform 0.2s ease;
      z-index: 2;
    }

    .btn-no:hover {
      transform: scale(1.1);
    }

    .btn-yes {
      background: rgba(255, 255, 255, 0.15);
      color: #ffccd5;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 12px 30px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 40px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: absolute;
      right: 15px;
      z-index: 100;
      user-select: none;
    }

    /* Chocolate Pop-up Modal */
    .choco-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(14px);
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
    }

    .choco-card {
      background: #ffffff;
      color: #2b040e;
      border-radius: 28px;
      padding: 35px 25px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 77, 109, 0.5);
      animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalPop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .choco-big-icon {
      font-size: 4.5rem;
      display: inline-block;
      margin-bottom: 12px;
      animation: chocoRotate 2s ease-in-out infinite alternate;
    }

    @keyframes chocoRotate {
      0% { transform: rotate(-8deg); }
      100% { transform: rotate(8deg); }
    }

    .choco-card h2 {
      font-family: 'Fredoka', cursive;
      font-size: 2.2rem;
      color: #a4133c;
      margin-bottom: 10px;
    }

    .choco-card p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #4a0e21;
      margin-bottom: 25px;
      font-weight: 500;
    }

    .btn-eat {
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 77, 109, 0.4);
      transition: transform 0.2s;
    }

    .btn-eat:hover {
      transform: scale(1.06);
    }

    /* Falling Chocolates */
    .falling-item {
      position: absolute;
      pointer-events: none;
      animation: fallDown 2.2s linear forwards;
      z-index: 1000;
      user-select: none;
    }

    @keyframes fallDown {
      0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="main-box">
    
    <div class="character-card">
      <div class="character-stage">
        
        <!-- Pouty/Angry Bear SVG -->
        <svg id="angrySvg" viewBox="0 0 200 200" width="160" height="160">
          <circle cx="50" cy="50" r="22" fill="#c49a75" stroke="#3d2314" stroke-width="6"/>
          <circle cx="150" cy="50" r="22" fill="#c49a75" stroke="#3d2314" stroke-width="6"/>
          <ellipse cx="100" cy="110" rx="65" ry="55" fill="#c49a75" stroke="#3d2314" stroke-width="6"/>
          <ellipse cx="100" cy="85" rx="58" ry="50" fill="#c49a75" stroke="#3d2314" stroke-width="6"/>
          <!-- Angry tilted eyebrows & eyes -->
          <line x1="65" y1="70" x2="85" y2="80" stroke="#3d2314" stroke-width="5" stroke-linecap="round"/>
          <line x1="135" y1="70" x2="115" y2="80" stroke="#3d2314" stroke-width="5" stroke-linecap="round"/>
          <circle cx="75" cy="85" r="5" fill="#3d2314"/>
          <circle cx="125" cy="85" r="5" fill="#3d2314"/>
          <!-- Red angry cheeks -->
          <circle cx="65" cy="100" r="8" fill="#ff4d6d" opacity="0.8"/>
          <circle cx="135" cy="100" r="8" fill="#ff4d6d" opacity="0.8"/>
          <!-- Pout mouth -->
          <ellipse cx="100" cy="98" rx="14" ry="10" fill="#fef08a"/>
          <ellipse cx="100" cy="95" rx="4" ry="3" fill="#3d2314"/>
          <path d="M 94 105 Q 100 98 106 105" stroke="#3d2314" stroke-width="4" fill="none" stroke-linecap="round"/>
        </svg>

        <!-- Happy Cheerful Bear SVG -->
        <svg id="happySvg" viewBox="0 0 200 200" width="160" height="160">
          <circle cx="50" cy="50" r="22" fill="#c49a75" stroke="#3d2314" stroke-width="6"/>
          <circle cx="150" cy="50" r="22" fill="#c49a75" stroke="#3d2314" stroke-width="6"/>
          <ellipse cx="100" cy="110" rx="65" ry="55" fill="#c49a75" stroke="#3d2314" stroke-width="6"/>
          <ellipse cx="100" cy="85" rx="58" ry="50" fill="#c49a75" stroke="#3d2314" stroke-width="6"/>
          <!-- Happy smiling curved eyes -->
          <path d="M 68 80 Q 76 70 84 80" stroke="#3d2314" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M 116 80 Q 124 70 132 80" stroke="#3d2314" stroke-width="5" fill="none" stroke-linecap="round"/>
          <!-- Pink blush -->
          <circle cx="65" cy="95" r="9" fill="#ff758f"/>
          <circle cx="135" cy="95" r="9" fill="#ff758f"/>
          <!-- Big happy smile -->
          <ellipse cx="100" cy="95" rx="14" ry="10" fill="#fef08a"/>
          <ellipse cx="100" cy="92" rx="4" ry="3" fill="#3d2314"/>
          <path d="M 92 98 Q 100 114 108 98 Z" fill="#ff4d6d" stroke="#3d2314" stroke-width="3"/>
        </svg>

      </div>
    </div>

    <h1 class="question-title">Are you mad at me? 🥺👉👈</h1>

    <div class="button-arena">
      <button class="btn-no" onclick="calmTheMood()">No! 🥰</button>
      <button id="yesBtn" class="btn-yes" onmouseover="dodgeYes()" onclick="dodgeYes()">Yes 😤</button>
    </div>

  </div>

  <!-- Virtual Chocolate Modal -->
  <div id="chocoModal" class="choco-modal">
    <div class="choco-card">
      <div class="choco-big-icon">🍫✨</div>
      <h2>Yayy! I Knew It! 🥰</h2>
      <p>Here is your sweet virtual chocolate & unlimited kisses to make your day 100x happier! 💖</p>
      <button class="btn-eat" onclick="closeChocoModal()">ACCEPT CHOCOLATE 😋</button>
    </div>
  </div>

  <script>
    let yesScale = 1;

    function dodgeYes() {
      const btn = document.getElementById('yesBtn');
      const maxRange = window.innerWidth <= 768 ? 130 : 260;
      
      const x = (Math.random() - 0.5) * maxRange;
      const y = (Math.random() - 0.5) * (maxRange * 0.8);
      
      // Scale down slightly each time they try to click Yes
      yesScale = Math.max(0.45, yesScale - 0.1);

      btn.style.transform = `translate(${x}px, ${y}px) scale(${yesScale})`;
    }

    function calmTheMood() {
      // Switch SVG character to happy
      document.getElementById('angrySvg').style.display = 'none';
      document.getElementById('happySvg').style.display = 'block';

      // Drop virtual chocolates
      rainChocolates();

      // Open Modal after slight bounce
      setTimeout(() => {
        document.getElementById('chocoModal').style.display = 'flex';
      }, 500);
    }

    function closeChocoModal() {
      document.getElementById('chocoModal').style.display = 'none';
    }

    function rainChocolates() {
      const icons = ['🍫', '🍬', '✨', '💖', '🍪', '🌸'];
      for (let i = 0; i < 40; i++) {
        setTimeout(() => {
          const item = document.createElement('div');
          item.className = 'falling-item';
          item.innerText = icons[Math.floor(Math.random() * icons.length)];
          item.style.left = Math.random() * 100 + 'vw';
          item.style.fontSize = (Math.random() * 20 + 24) + 'px';
          document.body.appendChild(item);

          setTimeout(() => item.remove(), 2300);
        }, i * 50);
      }
    }
  </script>
</body>
</html>
