<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ashish & Aarti — Royal Wedding Invitation</title>

    <!-- Google Fonts: Luxury Display, Sanskrit Serif & Royal Calligraphy -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600;700;800&family=Great+Vibes&family=Marcellus&family=Yatra+One&display=swap" rel="stylesheet">

    <style>
        /* ========================================================
           GLOBAL COLOR PALETTE & LUXURY DESIGN TOKENS
           ======================================================== */
        :root {
            /* Primary Royal Hues */
            --color-maroon-dark: #0a0204;
            --color-maroon-base: #1c050a;
            --color-maroon-rich: #3b0713;
            --color-burgundy: #500a1b;

            /* Luxury Gold Palette */
            --gold-bright: #fce8a9;
            --gold-base: #d4af37;
            --gold-rich: #b38822;
            --gold-deep: #8f6515;
            --gold-antique: #5f420c;
            --gold-glow: rgba(220, 175, 55, 0.45);

            /* Ivory & Candlelight */
            --ivory-warm: #fcf9f2;
            --ivory-muted: #e5dac4;
            --candle-core: #fff5df;
            --candle-flame: #ff9b26;

            /* Architectural Dark Carved Teakwood */
            --wood-darkest: #0e0705;
            --wood-dark: #1a0e09;
            --wood-panel: #27140c;
            --wood-highlight: #3d2114;

            /* Typography */
            --font-cinzel: 'Cinzel', serif;
            --font-cinzel-dec: 'Cinzel Decorative', serif;
            --font-marcellus: 'Marcellus', serif;
            --font-script: 'Great Vibes', cursive;
            --font-devanagari: 'Yatra One', 'Marcellus', serif;

            /* Cinematic Timing Tokens */
            --door-duration: 3.6s;
            --ease-cinematic: cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Reset & Mobile Constraints */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--color-maroon-dark);
            color: var(--ivory-warm);
            font-family: var(--font-marcellus);
            user-select: none;
            -webkit-user-select: none;
            position: fixed;
            inset: 0;
        }

        /* Audio Control Button (Subtle Luxury Pill) */
        .audio-toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(28, 5, 10, 0.7);
            border: 1px solid var(--gold-antique);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold-bright);
            cursor: pointer;
            backdrop-filter: blur(8px);
            opacity: 0.8;
            transition: all 0.3s ease;
        }
        .audio-toggle-btn:hover {
            opacity: 1;
            transform: scale(1.08);
            border-color: var(--gold-base);
        }
        .audio-toggle-btn svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
        }

        /* ========================================================
           SCREEN VIGNETTE & AMBIENT HAZE
           ======================================================== */
        .cinematic-vignette {
            position: fixed;
            inset: 0;
            z-index: 40;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(8, 2, 4, 0.65) 80%, rgba(4, 1, 2, 0.95) 100%);
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.85);
        }

        .ambient-fog {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: 
                radial-gradient(circle at 50% 100%, rgba(179, 136, 34, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 50% 20%, rgba(80, 10, 27, 0.25) 0%, transparent 70%);
            mix-blend-mode: screen;
            opacity: 0.9;
        }

        #cinematic-canvas {
            position: fixed;
            inset: 0;
            z-index: 35;
            pointer-events: none;
        }

        /* ========================================================
           CAMERA PERSPECTIVE CONTAINER (PHYSICAL ENTRY SYSTEM)
           ======================================================== */
        .world-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            perspective: 1300px;
            perspective-origin: 50% 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Camera rig moving through the palace */
        .camera-rig {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            will-change: transform, opacity;
            transition: transform var(--door-duration) var(--ease-cinematic);
        }

        /* Zoomed State: Camera dollies deeply forward past the threshold */
        .camera-rig.dollied-in {
            transform: translateZ(520px);
        }

        @media (max-width: 600px) {
            .camera-rig.dollied-in {
                transform: translateZ(420px);
            }
        }

        /* ========================================================
           SCENE 1: PALACE FAÇADE & GRAND PORTAL DOORS
           ======================================================== */
        .facade-stage {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: clamp(14px, 3vh, 28px) clamp(16px, 4vw, 36px);
            transform-style: preserve-3d;
            transition: opacity 1.8s ease 1.6s;
        }

        .camera-rig.dollied-in .facade-stage {
            opacity: 0;
            pointer-events: none;
        }

        /* Façade Stone Arch Background Texture */
        .palace-facade-bg {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 45%, var(--color-maroon-rich) 0%, var(--color-maroon-base) 50%, var(--color-maroon-dark) 100%);
            z-index: 1;
        }

        /* Carved Stone Arch Behind Door Frame */
        .palace-facade-bg::before {
            content: '';
            position: absolute;
            top: 2%;
            left: 50%;
            transform: translateX(-50%);
            width: min(94vw, 540px);
            height: 88vh;
            border-radius: 280px 280px 0 0;
            border: 2px solid rgba(212, 175, 55, 0.22);
            box-shadow: 
                0 0 50px rgba(0,0,0,0.8),
                inset 0 0 60px rgba(0,0,0,0.9);
            background: radial-gradient(circle at 50% 30%, rgba(59, 7, 19, 0.4) 0%, transparent 80%);
            pointer-events: none;
        }

        /* Top Header Typographic Composition */
        .facade-header {
            position: relative;
            z-index: 25;
            text-align: center;
            padding-top: clamp(6px, 1.5vh, 16px);
            animation: royalFadeDown 1.6s var(--ease-cinematic) both;
        }

        .header-ornament-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 4px;
        }

        .header-ornament-top::before,
        .header-ornament-top::after {
            content: '';
            width: clamp(35px, 9vw, 65px);
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-base));
        }
        .header-ornament-top::after {
            background: linear-gradient(90deg, var(--gold-base), transparent);
        }

        .header-ornament-top span {
            color: var(--gold-bright);
            font-size: 0.9rem;
            filter: drop-shadow(0 0 6px var(--gold-glow));
        }

        .facade-title-main {
            font-family: var(--font-cinzel);
            font-size: clamp(1.25rem, 3.8vw, 2.1rem);
            font-weight: 700;
            letter-spacing: 0.26em;
            color: var(--gold-bright);
            text-transform: uppercase;
            text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9), 0 0 24px rgba(212, 175, 55, 0.35);
        }

        .facade-title-sub {
            font-family: var(--font-script);
            font-size: clamp(1.4rem, 4.2vw, 2.3rem);
            color: var(--ivory-warm);
            letter-spacing: 0.04em;
            margin-top: -3px;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9);
            opacity: 0.95;
        }

        /* ========================================================
           GRAND CARVED WOODEN DOORS (WITH FLANKING DIYAS)
           ======================================================== */
        .portal-wrapper {
            position: relative;
            z-index: 24;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            width: 100%;
        }

        /* Flanking Floor Diyas on Door Entrance */
        .portal-diya {
            position: absolute;
            bottom: -8px;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 0 14px rgba(255, 155, 38, 0.55));
        }

        .portal-diya.left { left: clamp(4px, 4vw, 36px); }
        .portal-diya.right { right: clamp(4px, 4vw, 36px); }

        .diya-flame {
            width: 12px;
            height: 22px;
            background: radial-gradient(ellipse at 50% 80%, var(--candle-core) 0%, var(--candle-flame) 55%, transparent 95%);
            border-radius: 50% 50% 35% 35% / 80% 80% 30% 30%;
            box-shadow: 0 0 16px rgba(255, 170, 50, 0.9), 0 -4px 10px rgba(255, 230, 160, 0.6);
            animation: flameFlicker 2.8s ease-in-out infinite alternate;
            transform-origin: center bottom;
        }

        .diya-base-cup {
            width: 32px;
            height: 12px;
            background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold-deep) 70%, var(--gold-antique) 100%);
            border-radius: 0 0 20px 20px;
            border: 1px solid var(--gold-base);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
            margin-top: -2px;
            position: relative;
        }
        .diya-base-cup::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 20%;
            width: 60%;
            height: 3px;
            background: var(--gold-bright);
            border-radius: 50%;
        }

        @keyframes flameFlicker {
            0% { transform: scale(0.96) rotate(-2deg); opacity: 0.9; }
            35% { transform: scale(1.08, 1.14) rotate(2deg); opacity: 1; filter: drop-shadow(0 0 18px rgba(255, 160, 40, 0.85)); }
            70% { transform: scale(0.92, 0.98) rotate(-1deg); opacity: 0.85; }
            100% { transform: scale(1.04, 1.06) rotate(1.5deg); opacity: 0.98; }
        }

        /* Door Outer Architectural Frame */
        .doors-frame {
            position: relative;
            width: min(86vw, 440px);
            height: clamp(370px, 60vh, 580px);
            border-radius: 260px 260px 6px 6px;
            padding: 9px 9px 0 9px;
            background: linear-gradient(180deg, #3d2114 0%, #160a06 60%, #0d0503 100%);
            border: 2px solid var(--gold-base);
            border-bottom: 5px solid #000;
            box-shadow: 
                0 25px 65px rgba(0, 0, 0, 0.95),
                0 0 40px rgba(212, 175, 55, 0.22),
                inset 0 0 25px rgba(0, 0, 0, 0.95);
            display: flex;
            perspective: 1500px;
        }

        /* Intricate Jali Arch Trim Ring */
        .doors-frame::before {
            content: '';
            position: absolute;
            inset: -8px -8px 0 -8px;
            border-radius: 268px 268px 0 0;
            border: 1px dashed rgba(245, 215, 127, 0.45);
            pointer-events: none;
        }

        .door-wings-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            border-radius: 250px 250px 0 0;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        /* Door Leaves: Carved Antique Wood */
        .door-leaf {
            position: relative;
            width: 50%;
            height: 100%;
            background: 
                linear-gradient(135deg, rgba(255, 220, 130, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 50% 50%, var(--wood-highlight) 0%, var(--wood-panel) 50%, var(--wood-dark) 100%);
            box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.95);
            transform-style: preserve-3d;
            will-change: transform;
            transition: transform var(--door-duration) var(--ease-cinematic);
            overflow: hidden;
        }

        .door-leaf.left {
            transform-origin: left center;
            border-right: 1.5px solid #080302;
        }

        .door-leaf.right {
            transform-origin: right center;
            border-left: 1.5px solid rgba(212, 175, 55, 0.35);
        }

        /* Wood Carving Panels */
        .door-panel-decor {
            position: absolute;
            inset: 10px 8px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: inherit;
            padding: 10px 5px;
            background: rgba(10, 4, 2, 0.35);
        }

        .carved-cell {
            position: relative;
            width: 100%;
            border: 1px solid rgba(212, 175, 55, 0.28);
            background: linear-gradient(145deg, rgba(61, 33, 20, 0.7) 0%, rgba(20, 9, 5, 0.9) 100%);
            box-shadow: 
                inset 1px 1px 4px rgba(255, 215, 120, 0.18),
                inset -1px -1px 4px rgba(0, 0, 0, 0.9),
                0 3px 8px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carved-cell.arch-top {
            height: 38%;
            border-radius: 120px 120px 4px 4px;
        }
        .carved-cell.mid-panel {
            height: 27%;
            border-radius: 5px;
        }
        .carved-cell.bottom-panel {
            height: 27%;
            border-radius: 4px;
        }

        /* Brass Studs / Kilas */
        .stud {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, var(--gold-bright) 0%, var(--gold-base) 60%, var(--gold-deep) 100%);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
        }
        .stud.tl { top: 6px; left: 6px; }
        .stud.tr { top: 6px; right: 6px; }
        .stud.bl { bottom: 6px; left: 6px; }
        .stud.br { bottom: 6px; right: 6px; }

        .indian-motif-svg {
            width: clamp(34px, 6.5vw, 46px);
            height: clamp(34px, 6.5vw, 46px);
            opacity: 0.68;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        /* Heavy Brass Temple Door Handles */
        .door-handle-assembly {
            position: absolute;
            top: 52%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 15;
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.95));
        }
        .door-leaf.left .door-handle-assembly { right: 8px; }
        .door-leaf.right .door-handle-assembly { left: 8px; }

        .brass-escutcheon {
            width: 14px;
            height: 56px;
            background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold-base) 50%, var(--gold-deep) 100%);
            border: 1px solid #ffea9f;
            border-radius: 6px;
            box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.7);
        }

        .brass-ring {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 4px solid var(--gold-bright);
            box-shadow: 
                0 4px 8px rgba(0, 0, 0, 0.85),
                inset 0 2px 4px rgba(0, 0, 0, 0.6);
            margin-top: -16px;
        }

        /* Warm Candle Light Leaking Through Closed Seams */
        .door-seam-leak {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            background: linear-gradient(180deg, transparent 0%, rgba(255, 215, 120, 0.95) 20%, rgba(255, 185, 75, 1) 50%, rgba(255, 215, 120, 0.95) 80%, transparent 100%);
            filter: blur(2px);
            opacity: 0.85;
            z-index: 8;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* Door Open Transform (SCENE 2 ACTIVATION) */
        .doors-frame.open-doors .door-leaf.left {
            transform: rotateY(-105deg);
        }
        .doors-frame.open-doors .door-leaf.right {
            transform: rotateY(105deg);
        }
        .doors-frame.open-doors .door-seam-leak {
            opacity: 0;
        }

        /* Light Bloom Burst as Doors Open */
        .portal-bloom-light {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, #fff7de 0%, #fbd578 30%, #5d1121 70%, transparent 100%);
            opacity: 0;
            filter: blur(26px);
            z-index: 2;
            pointer-events: none;
            transition: opacity 2.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .doors-frame.open-doors .portal-bloom-light {
            opacity: 0.92;
        }

        /* Bottom Section: Names & Invitation Button */
        .facade-footer {
            position: relative;
            z-index: 25;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding-bottom: clamp(10px, 2.5vh, 22px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .facade-footer.fading-out {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        .couple-names-preview {
            font-family: var(--font-cinzel);
            font-size: clamp(1.2rem, 3.4vw, 1.85rem);
            font-weight: 700;
            letter-spacing: 0.28em;
            color: var(--ivory-warm);
            text-transform: uppercase;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .couple-names-preview span {
            color: var(--gold-bright);
            font-family: var(--font-marcellus);
            font-size: 0.85em;
        }

        /* Premium Golden Trigger Button */
        .royal-enter-button {
            position: relative;
            background: linear-gradient(135deg, #440a17 0%, #20040a 100%);
            color: var(--gold-bright);
            font-family: var(--font-cinzel);
            font-size: clamp(0.85rem, 2.3vw, 1.05rem);
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            padding: clamp(13px, 2vh, 18px) clamp(24px, 6vw, 42px);
            border: 1px solid var(--gold-base);
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.85),
                0 0 25px rgba(212, 175, 55, 0.35),
                inset 0 0 14px rgba(212, 175, 55, 0.2);
            transition: all 0.4s var(--ease-cinematic);
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .royal-enter-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 245, 215, 0.4), transparent);
            transform: skewX(-25deg);
            transition: left 0.9s ease;
        }

        .royal-enter-button:hover::before {
            left: 140%;
        }

        .royal-enter-button:hover {
            transform: translateY(-2px) scale(1.02);
            border-color: var(--gold-bright);
            box-shadow: 
                0 14px 40px rgba(0, 0, 0, 0.95),
                0 0 35px rgba(212, 175, 55, 0.6),
                inset 0 0 20px rgba(212, 175, 55, 0.4);
        }

        .royal-enter-button:active {
            transform: translateY(1px) scale(0.98);
        }

        .enter-hint-text {
            margin-top: 8px;
            font-size: 0.76rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--ivory-muted);
            opacity: 0.65;
        }

        /* ========================================================
           SCENE 3 & 4: SANCTUM INTERIOR & LORD GANESHA REVELATION
           ======================================================== */
        .sanctum-stage {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: clamp(20px, 4vh, 40px) clamp(16px, 4vw, 36px);
            opacity: 0;
            transform: scale(0.88);
            transition: 
                opacity 2.8s var(--ease-cinematic) 1.2s,
                transform 3.5s var(--ease-cinematic) 1.2s;
            pointer-events: none;
        }

        /* Active Sanctum (Revealed and zoomed) */
        .camera-rig.dollied-in .sanctum-stage {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* Palace Interior Architecture Background */
        .sanctum-interior-bg {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 48%, rgba(212, 175, 55, 0.18) 0%, rgba(59, 7, 19, 0.5) 45%, var(--color-maroon-dark) 100%),
                linear-gradient(180deg, rgba(10, 2, 4, 0.7) 0%, rgba(45, 6, 15, 0.8) 50%, rgba(8, 2, 4, 0.95) 100%);
            z-index: 1;
        }

        /* Hanging Royal Brass Diyas on Interior Pillars */
        .hanging-diya-column {
            position: absolute;
            top: -20px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hanging-diya-column.left { left: clamp(12px, 5vw, 60px); }
        .hanging-diya-column.right { right: clamp(12px, 5vw, 60px); }

        .brass-chain {
            width: 2px;
            height: clamp(80px, 18vh, 150px);
            background: repeating-linear-gradient(180deg, var(--gold-bright) 0px, var(--gold-deep) 4px, var(--gold-antique) 8px);
            box-shadow: 0 0 6px rgba(0,0,0,0.8);
        }

        /* Hanging Diya Bowl with Glowing Flame */
        .hanging-diya-lamp {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -4px;
        }

        /* Interior Toran / Marigold Garland Header */
        .royal-floral-garland {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: min(94vw, 620px);
            height: 48px;
            z-index: 4;
            opacity: 0.85;
            background-image: radial-gradient(circle, #e59419 6px, transparent 7px), radial-gradient(circle, #d03010 4px, transparent 5px);
            background-size: 24px 24px;
            background-repeat: repeat-x;
            background-position: 0 0, 12px 10px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
        }

        /* Central Ganesha Shrine Container */
        .ganesha-shrine {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 580px;
            width: 100%;
            margin: auto 0;
        }

        /* Invocation Title */
        .ganesha-invocation {
            font-family: var(--font-devanagari);
            font-size: clamp(1.4rem, 4vw, 2.1rem);
            color: var(--gold-bright);
            letter-spacing: 0.12em;
            margin-bottom: clamp(12px, 2.5vh, 22px);
            text-shadow: 
                0 0 16px rgba(252, 232, 169, 0.6),
                0 2px 10px rgba(0, 0, 0, 0.9);
            opacity: 0;
            transform: translateY(14px);
            transition: opacity 1.8s var(--ease-cinematic) 2.2s, transform 1.8s var(--ease-cinematic) 2.2s;
        }

        .camera-rig.dollied-in .ganesha-invocation {
            opacity: 1;
            transform: translateY(0);
        }

        /* Pedestal & Ganesha Icon Assembly */
        .shrine-altar-assembly {
            position: relative;
            width: 190px;
            height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: clamp(14px, 2.8vh, 26px);
        }

        /* Radiating Divine Aura behind Ganpati */
        .ganesha-divine-aura {
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 225, 140, 0.45) 0%, rgba(212, 175, 55, 0.2) 45%, transparent 70%);
            animation: auraPulse 4s ease-in-out infinite alternate;
            filter: blur(12px);
            z-index: 1;
        }

        @keyframes auraPulse {
            0% { transform: scale(0.92); opacity: 0.5; }
            100% { transform: scale(1.15); opacity: 0.85; filter: blur(16px); }
        }

        /* Lord Ganesha SVG Illustration (Pure, Peaceful, Vectorized Antique Gold Idol) */
        .ganesha-idol-svg {
            position: relative;
            z-index: 5;
            width: clamp(120px, 24vw, 155px);
            height: clamp(120px, 24vw, 155px);
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 20px rgba(212, 175, 55, 0.5));
            opacity: 0;
            transform: scale(0.85);
            transition: opacity 2s var(--ease-cinematic) 2.5s, transform 2.2s var(--ease-cinematic) 2.5s;
        }

        .camera-rig.dollied-in .ganesha-idol-svg {
            opacity: 1;
            transform: scale(1);
        }

        /* Altar Diyas on Left and Right of Ganpati */
        .altar-diya {
            position: absolute;
            bottom: 12px;
            z-index: 8;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .altar-diya.left { left: 0; }
        .altar-diya.right { right: 0; }

        /* Royal Sanskrit Shloka Typography (Line-by-line Reveal) */
        .shloka-box {
            position: relative;
            z-index: 10;
            font-family: var(--font-devanagari);
            font-size: clamp(1.05rem, 3.2vw, 1.45rem);

            letter-spacing: 0.08em;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95);
            margin-bottom: clamp(16px, 3.2vh, 30px);
            max-width: 480px;
        }

        .shloka-line {
            display: block;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 1.4s var(--ease-cinematic), transform 1.4s var(--ease-cinematic);
        }

        /* Cascading Shloka Stagger */
        .camera-rig.dollied-in .shloka-line.l1 {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 3.2s;

    <!-- ========================================================
         VANILLA JAVASCRIPT: PARTICLES, CINEMATICS & AUDIO
         ======================================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            /* ----------------------------------------------------
               1. PARTICLES & GENTLE ROSE PETALS (CANVAS)
               ---------------------------------------------------- */
            const canvas = document.getElementById('cinematic-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let isSceneOpened = false;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            // Dual Particle Engine: Golden Sparkles + Floating Velvet Rose Petals
            class Particle {
                constructor(isPetal = false) {
                    this.isPetal = isPetal;
                    this.reset(true);
                }

                reset(initial = false) {
                    this.x = Math.random() * canvas.width;
                    this.y = initial ? Math.random() * canvas.height : -20;
                    
                    if (this.isPetal) {
                        this.size = Math.random() * 4 + 3;
                        this.speedY = Math.random() * 0.45 + 0.25;
                        this.speedX = Math.sin(Math.random() * Math.PI) * 0.4;
                        this.rotation = Math.random() * 360;
                        this.rotSpeed = (Math.random() - 0.5) * 0.8;
                        this.opacity = Math.random() * 0.45 + 0.25;
                    } else {
                        // Golden Dust Sparkle
                        this.size = Math.random() * 2 + 0.8;
                        this.speedY = -(Math.random() * 0.4 + 0.2); // Golden dust drifts gently upwards
                        this.speedX = (Math.random() - 0.5) * 0.3;
                        this.opacity = Math.random() * 0.65 + 0.2;
                        this.pulseSpeed = Math.random() * 0.02 + 0.01;
                        this.pulseVal = Math.random() * Math.PI;
                    }
                }

                update() {
                    if (this.isPetal) {
                        this.y += this.speedY;
                        this.x += this.speedX + Math.sin(this.y * 0.01) * 0.3;
                        this.rotation += this.rotSpeed;

                        if (this.y > canvas.height + 20 || this.x < -20 || this.x > canvas.width + 20) {
                            this.reset(false);
                        }
                    } else {
                        this.y += this.speedY;
                        this.x += this.speedX;
                        this.pulseVal += this.pulseSpeed;

                        // When sanctum opens, particles converge subtly towards the center
                        if (isSceneOpened) {
                            const centerX = canvas.width / 2;
                            this.x += (centerX - this.x) * 0.0008;
                        }

                        if (this.y < -20 || this.x < -20 || this.x > canvas.width + 20) {
                            this.reset(false);
                            this.y = canvas.height + 10;
                        }
                    }
                }

                draw() {
                    if (this.isPetal) {
                        ctx.save();
                        ctx.translate(this.x, this.y);
                        ctx.rotate((this.rotation * Math.PI) / 180);
                        ctx.fillStyle = `rgba(163, 24, 46, ${this.opacity})`;
                        ctx.beginPath();
                        ctx.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    } else {
                        const curOpacity = this.opacity * (0.6 + Math.sin(this.pulseVal) * 0.4);
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(252, 232, 169, ${curOpacity})`;
                        ctx.shadowBlur = 6;
                        ctx.shadowColor = 'rgba(212, 175, 55, 0.6)';
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                }
            }

            function initParticles() {
                resizeCanvas();
                particles = [];
                const dustCount = window.innerWidth < 600 ? 30 : 55;
                const petalCount = window.innerWidth < 600 ? 8 : 16;

                for (let i = 0; i < dustCount; i++) particles.push(new Particle(false));
                for (let i = 0; i < petalCount; i++) particles.push(new Particle(true));
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animateParticles);
            }

            window.addEventListener('resize', () => {
                resizeCanvas();
            });

            initParticles();
            animateParticles();

            /* ----------------------------------------------------
               2. AUDIO HANDLING (MUSIC TRIGGER)
               ---------------------------------------------------- */
            const audioEl = document.getElementById('wedding-audio');
            const audioBtn = document.getElementById('btn-toggle-audio');
            const iconUnmuted = document.getElementById('audio-icon-unmuted');
            const iconMuted = document.getElementById('audio-icon-muted');
            let isAudioPlaying = false;

            function playWeddingMusic() {
                if (audioEl) {
                    audioEl.volume = 0.65;
                    audioEl.play().then(() => {
                        isAudioPlaying = true;
                        iconUnmuted.style.display = 'block';
                        iconMuted.style.display = 'none';
                    }).catch(() => {
                        // Autoplay policy was restricted; wait for next user tap
                        isAudioPlaying = false;
                    });
                }
            }

            audioBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!audioEl) return;
                if (isAudioPlaying) {
                    audioEl.pause();
                    isAudioPlaying = false;
                    iconUnmuted.style.display = 'none';
                    iconMuted.style.display = 'block';
                } else {
                    playWeddingMusic();
                }
            });

            /* ----------------------------------------------------
               3. THE CINEMATIC PALACE ENTRY SEQUENCE
               ---------------------------------------------------- */
            const btnOpen = document.getElementById('btn-open-invitation');
            const doorsFrame = document.getElementById('doors-frame');
            const cameraRig = document.getElementById('camera-rig');
            const facadeFooter = document.getElementById('facade-footer');

            let sequenceStarted = false;

            function triggerCinematicEntrance() {
                if (sequenceStarted) return;
                sequenceStarted = true;
                isSceneOpened = true;

                // 1. Play background music
                playWeddingMusic();

                // 2. Button and footer fade away smoothly
                facadeFooter.classList.add('fading-out');

                // 3. Doors swing slowly open with warm light burst
                doorsFrame.classList.add('open-doors');

                // 4. Physical Camera Dolly: Move perspective deeply forward into the palace hall
                setTimeout(() => {
                    cameraRig.classList.add('dollied-in');
                }, 600);
            }

            // Click & touch interactions
            btnOpen.addEventListener('click', triggerCinematicEntrance);
            doorsFrame.addEventListener('click', triggerCinematicEntrance);
        });
    </script>
</body>
</html>
