<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ashish & Aarti — Royal Wedding Invitation</title>

    <!-- Google Fonts: Premium Serif & Royal Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Great+Vibes&family=Marcellus&display=swap" rel="stylesheet">

    <style>
        /* ========================================================
           GLOBAL COLOR PALETTE & LUXURY DESIGN TOKENS
           ======================================================== */
        :root {
            /* Primary Royal Hues */
            --color-maroon-dark: #120306;
            --color-maroon-base: #2a0810;
            --color-maroon-rich: #480d19;
            --color-burgundy: #5d1121;

            /* Luxury Gold Palette */
            --gold-bright: #f5d77f;
            --gold-base: #d4af37;
            --gold-deep: #aa7c11;
            --gold-antique: #826019;
            --gold-shadow: rgba(212, 175, 55, 0.25);

            /* Ivory & Highlights */
            --ivory-warm: #faf5eb;
            --ivory-muted: #e7decb;
            --candle-glow: rgba(255, 200, 115, 0.45);

            /* Architectural Wood Palette */
            --wood-dark: #180d09;
            --wood-panel: #27160e;
            --wood-border: #382014;
            --wood-highlight: #4a2d1d;

            /* Fonts */
            --font-cinzel: 'Cinzel', serif;
            --font-marcellus: 'Marcellus', serif;
            --font-script: 'Great Vibes', cursive;

            /* Fluid Typography */
            --fs-title: clamp(1.4rem, 4vw, 2.3rem);
            --fs-sub: clamp(0.75rem, 2vw, 0.95rem);
            --fs-btn: clamp(0.85rem, 2.2vw, 1.05rem);
        }

        /* Reset & Core Setup */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--color-maroon-dark);
            color: var(--ivory-warm);
            font-family: var(--font-marcellus);
            user-select: none;
            -webkit-user-select: none;
        }

        /* ========================================================
           BACKGROUND AMBIENCE & PALACE GLOW
           ======================================================== */
        .ambient-background {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: 
                radial-gradient(circle at 50% 50%, var(--color-maroon-rich) 0%, var(--color-maroon-base) 45%, var(--color-maroon-dark) 100%);
            overflow: hidden;
        }

        /* Subtle Arch Motif on wall behind doors */
        .ambient-background::before {
            content: '';
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: min(92vw, 750px);
            height: 110%;
            background: radial-gradient(circle at 50% 40%, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
            border-radius: 50% 50% 0 0;
            pointer-events: none;
        }

        /* Canvas for drifting golden sparks */
        #particle-canvas {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* Warm Candlelight Flickering behind the door seam */
        .palace-core-light {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 25vw;
            height: 70vh;
            background: radial-gradient(ellipse at center, rgba(255, 215, 120, 0.85) 0%, rgba(212, 175, 55, 0.4) 40%, transparent 80%);
            filter: blur(28px);
            opacity: 0.35;
            z-index: 2;
            pointer-events: none;
            animation: candleFlicker 4.5s ease-in-out infinite alternate;
        }

        @keyframes candleFlicker {
            0% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.96); filter: blur(24px); }
            50% { opacity: 0.45; transform: translate(-50%, -50%) scale(1.05); filter: blur(30px); }
            100% { opacity: 0.35; transform: translate(-50%, -50%) scale(1); filter: blur(26px); }
        }

        /* ========================================================
           OPENING SCREEN WRAPPER
           ======================================================== */
        .stage-container {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: clamp(15px, 3vh, 32px) clamp(16px, 4vw, 36px);
            perspective: 1200px;
            transition: opacity 1.8s cubic-bezier(0.25, 1, 0.5, 1), transform 2.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* When camera moves in */
        .stage-container.zoomed-in {
            transform: scale(1.18);
            opacity: 0;
            pointer-events: none;
        }

        /* Header Area */
        .header-title-box {
            text-align: center;
            z-index: 10;
            padding-top: clamp(8px, 1.5vh, 20px);
            animation: fadeInDown 1.8s ease-out both;
        }

        .decorative-emblem {
            display: inline-block;
            width: 32px;
            height: 12px;
            margin-bottom: 6px;
            opacity: 0.8;
            fill: var(--gold-base);
        }

        .header-subtitle {
            font-family: var(--font-cinzel);
            font-size: var(--fs-sub);
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--gold-bright);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
            margin-bottom: 4px;
        }

        .header-main-title {
            font-family: var(--font-cinzel);
            font-size: var(--fs-title);
            font-weight: 600;
            letter-spacing: 0.14em;
            color: var(--ivory-warm);
            text-transform: uppercase;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .header-line-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 6px auto 0;
            width: min(80vw, 320px);
            opacity: 0.85;
        }

        .header-line-divider::before,
        .header-line-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-base), transparent);
        }

        .header-line-divider span {
            color: var(--gold-bright);
            font-size: 0.75rem;
        }

        /* ========================================================
           GRAND ROYAL CARVED PALACE DOORS
           ======================================================== */
        .doors-assembly {
            position: relative;
            width: min(88vw, 420px);
            height: clamp(340px, 58vh, 560px);
            margin: auto 0;
            perspective: 1400px;
            border-radius: 260px 260px 4px 4px;
            padding: 8px 8px 0 8px;
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.95),
                0 0 35px rgba(138, 26, 44, 0.4),
                inset 0 0 25px rgba(0, 0, 0, 0.8);
            background: linear-gradient(180deg, var(--wood-border) 0%, #150a06 100%);
            border: 2px solid var(--gold-antique);
            border-bottom: 4px solid var(--wood-dark);
            display: flex;
            overflow: visible;
        }

        /* Archway Outer Carving Ring */
        .doors-assembly::before {
            content: '';
            position: absolute;
            inset: -9px -9px 0 -9px;
            border: 1px solid var(--gold-base);
            border-radius: 270px 270px 0 0;
            opacity: 0.4;
            pointer-events: none;
        }

        /* Threshold glow between bottom and floor */
        .doors-assembly::after {
            content: '';
            position: absolute;
            bottom: -14px;
            left: 10%;
            width: 80%;
            height: 20px;
            background: radial-gradient(ellipse at center, rgba(212, 175, 55, 0.35) 0%, transparent 70%);
            filter: blur(6px);
            pointer-events: none;
        }

        .door-panel-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            border-radius: 250px 250px 0 0;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        /* Common Door Wing Rules */
        .door-leaf {
            position: relative;
            width: 50%;
            height: 100%;
            background: 
                linear-gradient(135deg, rgba(255, 215, 120, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 50% 50%, var(--wood-highlight) 0%, var(--wood-panel) 50%, var(--wood-dark) 100%);
            box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.9);
            transform-style: preserve-3d;
            transition: transform 3.2s cubic-bezier(0.25, 0.85, 0.25, 1);
            will-change: transform;
            overflow: hidden;
        }

        .door-leaf.left {
            transform-origin: left center;
            border-right: 1.5px solid #000;
        }

        .door-leaf.right {
            transform-origin: right center;
            border-left: 1.5px solid rgba(212, 175, 55, 0.4);
        }

        /* Subtle Wood Grain Overlay */
        .wood-texture {
            position: absolute;
            inset: 0;
            opacity: 0.16;
            background-image: repeating-linear-gradient(
                90deg,
                rgba(0, 0, 0, 0.15) 0px,
                rgba(0, 0, 0, 0.15) 2px,
                transparent 2px,
                transparent 8px
            );
            pointer-events: none;
        }

        /* Ornate Traditional Paneling on Doors */
        .door-panel-artwork {
            position: absolute;
            inset: 10px 8px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--gold-antique);
            border-radius: inherit;
            padding: 12px 6px;
            background: rgba(0, 0, 0, 0.2);
        }

        .carved-box {
            width: 90%;
            border: 1px solid rgba(212, 175, 55, 0.35);
            background: linear-gradient(145deg, rgba(56, 32, 20, 0.6) 0%, rgba(20, 10, 6, 0.8) 100%);
            box-shadow: 
                inset 1px 1px 4px rgba(255, 215, 120, 0.15),
                inset -1px -1px 4px rgba(0, 0, 0, 0.8),
                0 3px 8px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .carved-box.arch-top {
            height: 38%;
            border-radius: 120px 120px 6px 6px;
            margin-top: 4px;
        }

        .carved-box.square-mid {
            height: 25%;
            border-radius: 6px;
        }

        .carved-box.square-bottom {
            height: 25%;
            border-radius: 6px;
            margin-bottom: 4px;
        }

        /* Traditional Brass Studs (Rivets/Kilas) */
        .brass-stud {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, var(--gold-bright) 0%, var(--gold-base) 55%, var(--gold-deep) 100%);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            position: absolute;
        }

        .stud-tl { top: 6px; left: 6px; }
        .stud-tr { top: 6px; right: 6px; }
        .stud-bl { bottom: 6px; left: 6px; }
        .stud-br { bottom: 6px; right: 6px; }

        /* Indian Floral Medallion inside carving */
        .mandala-medallion {
            width: clamp(34px, 7vw, 48px);
            height: clamp(34px, 7vw, 48px);
            opacity: 0.65;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
        }

        /* Ornate Royal Brass Handles / Kundan Door Rings */
        .door-handle-assembly {
            position: absolute;
            top: 54%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 15;
            filter: drop-shadow(0 5px 12px rgba(0, 0, 0, 0.95));
        }

        .door-leaf.left .door-handle-assembly {
            right: 8px;
        }

        .door-leaf.right .door-handle-assembly {
            left: 8px;
        }

        .brass-plate {
            width: 14px;
            height: 58px;
            background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold-base) 50%, var(--gold-antique) 100%);
            border: 1px solid #ffea9f;
            border-radius: 8px;
            box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .door-ring {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 3.5px solid var(--gold-bright);
            box-shadow: 
                0 3px 6px rgba(0, 0, 0, 0.8),
                inset 0 2px 4px rgba(0, 0, 0, 0.6);
            margin-top: -12px;
            background: transparent;
        }

        /* Door Light Leak Seam when closed */
        .door-seam-glow {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            background: linear-gradient(180deg, transparent, rgba(255, 215, 120, 0.9), transparent);
            filter: blur(1.5px);
            opacity: 0.75;
            z-index: 8;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* ========================================================
           BOTTOM INTERACTIVE BUTTON & INSTRUCTIONS
           ======================================================== */
        .footer-action-box {
            text-align: center;
            z-index: 10;
            padding-bottom: clamp(10px, 2.5vh, 24px);
            animation: fadeInUp 1.8s ease-out both;
        }

        .royal-enter-button {
            position: relative;
            background: linear-gradient(135deg, #440d18 0%, #20050b 100%);
            color: var(--gold-bright);
            font-family: var(--font-cinzel);
            font-size: var(--fs-btn);
            font-weight: 700;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            padding: clamp(14px, 2.2vh, 18px) clamp(26px, 6vw, 42px);
            border: 1px solid var(--gold-base);
            border-radius: 50px;
            cursor: pointer;
            outline: none;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.8),
                0 0 25px rgba(212, 175, 55, 0.35),
                inset 0 0 14px rgba(212, 175, 55, 0.2);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        /* Subtle metallic sheen sweep */
        .royal-enter-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 245, 220, 0.4), transparent);
            transform: skewX(-25deg);
            transition: left 0.9s ease;
        }

        .royal-enter-button:hover::before,
        .royal-enter-button:focus::before {
            left: 140%;
        }

        .royal-enter-button:hover {
            transform: translateY(-2px) scale(1.02);
            border-color: var(--gold-bright);
            box-shadow: 
                0 14px 40px rgba(0, 0, 0, 0.9),
                0 0 35px rgba(212, 175, 55, 0.55),
                inset 0 0 20px rgba(212, 175, 55, 0.35);
        }

        .royal-enter-button:active {
            transform: translateY(1px) scale(0.98);
        }

        .subtle-tap-instruction {
            margin-top: 10px;
            font-size: 0.78rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--ivory-muted);
            opacity: 0.65;
            font-weight: 400;
        }

        /* ========================================================
           CINEMATIC OPENING ANIMATIONS (STATE: .is-opening)
           ======================================================== */
        .doors-assembly.is-opening .door-leaf.left {
            transform: rotateY(-96deg);
        }

        .doors-assembly.is-opening .door-leaf.right {
            transform: rotateY(96deg);
        }

        .doors-assembly.is-opening .door-seam-glow {
            opacity: 0;
        }

        /* Burst of brilliant royal light as doors swing wide */
        .sanctum-burst-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, #ffe9b3 0%, #dfb64d 30%, #4a0d18 70%, transparent 100%);
            opacity: 0;
            filter: blur(20px);
            z-index: 1;
            pointer-events: none;
            transition: opacity 2.2s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .doors-assembly.is-opening .sanctum-burst-glow {
            opacity: 0.95;
        }

        /* ========================================================
           TEMPORARY TRANSITION / PLACEHOLDER SCREEN
           ======================================================== */
        <!-- TEMPORARY NEXT SECTION -->
        .next-section-transition {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: radial-gradient(circle at center, var(--color-maroon-rich) 0%, var(--color-maroon-dark) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 2.4s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 2.4s;
            pointer-events: none;
        }

        .next-section-transition.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .transition-content-box {
            max-width: 600px;
            padding: 40px 30px;
            border: 1px solid var(--gold-antique);
            border-radius: 12px;
            background: rgba(20, 4, 8, 0.65);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.15);
            position: relative;
        }

        .transition-corner-motif {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 2px solid var(--gold-base);
            opacity: 0.7;
        }

        .t-top-left { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .t-top-right { top: -2px; right: -2px; border-left: none; border-bottom: none; }
        .t-bottom-left { bottom: -2px; left: -2px; border-right: none; border-top: none; }
        .t-bottom-right { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        .transition-placeholder-text {
            font-family: var(--font-cinzel);
            font-size: clamp(1.2rem, 3.5vw, 1.8rem);
            color: var(--gold-bright);
            letter-spacing: 0.18em;
            line-height: 1.6;
            margin-bottom: 12px;
            text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9);
        }

        .transition-sub-note {
            font-family: var(--font-marcellus);
            font-size: clamp(0.85rem, 2vw, 1rem);
            color: var(--ivory-muted);
            opacity: 0.75;
            letter-spacing: 0.1em;
        }

        /* Keyframes */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Optimization */
        @media (max-width: 480px) {
            .doors-assembly {
                width: 90vw;
                height: 54vh;
                min-height: 330px;
                border-radius: 200px 200px 4px 4px;
            }

            .door-panel-container {
                border-radius: 190px 190px 0 0;
            }

            .doors-assembly::before {
                border-radius: 205px 205px 0 0;
            }

            .royal-enter-button {
                width: 100%;
                max-width: 290px;
                letter-spacing: 0.18em;
            }
        }
    </style>
</head>
<body>

    <!-- AMBIENT ROYAL ATMOSPHERE -->
    <div class="ambient-background"></div>
    <div class="palace-core-light"></div>
    <canvas id="particle-canvas"></canvas>

    <!-- ========================================================
         OPENING SCREEN
         ======================================================== -->
    <!-- OPENING SCREEN -->
    <main class="stage-container" id="opening-stage">
        
        <!-- Top Title -->
        <header class="header-title-box">
            <!-- Royal Arch Emblem SVG -->
            <svg class="decorative-emblem" viewBox="0 0 100 35">
                <path d="M50 0 C30 15, 10 18, 0 35 C30 25, 70 25, 100 35 C90 18, 70 15, 50 0 Z" />
            </svg>
            <div class="header-subtitle">Invitation</div>
            <h1 class="header-main-title">A Royal Celebration of Love</h1>
            <div class="header-line-divider">
                <span>✦</span>
            </div>
        </header>

        <!-- Grand Indian Wooden Palace Doors -->
        <!-- DOOR ANIMATION -->
        <section class="doors-assembly" id="doors-assembly" aria-label="Royal Palace Doors">
            <div class="sanctum-burst-glow"></div>
            <div class="door-seam-glow"></div>

            <div class="door-panel-container">
                
                <!-- Left Door Wing -->
                <div class="door-leaf left" id="door-left">
                    <div class="wood-texture"></div>
                    <div class="door-panel-artwork">
                        
                        <!-- Top Arch Carving -->
                        <div class="carved-box arch-top">
                            <span class="brass-stud stud-tl"></span>
                            <span class="brass-stud stud-tr"></span>
                            <span class="brass-stud stud-bl"></span>
                            <span class="brass-stud stud-br"></span>
                            <!-- Indian Traditional Floral Jali Motif -->
                            <svg class="mandala-medallion" viewBox="0 0 100 100" fill="none" stroke="var(--gold-bright)" stroke-width="3">
                                <circle cx="50" cy="50" r="38" stroke-dasharray="4 3"/>
                                <circle cx="50" cy="50" r="22"/>
                                <path d="M50 12 Q50 50 88 50 Q50 50 50 88 Q50 50 12 50 Q50 50 50 12 Z" fill="rgba(212,175,55,0.2)"/>
                            </svg>
                        </div>

                        <!-- Center Panel with Handle -->
                        <div class="carved-box square-mid">
                            <span class="brass-stud stud-tl"></span>
                            <span class="brass-stud stud-tr"></span>
                            <span class="brass-stud stud-bl"></span>
                            <span class="brass-stud stud-br"></span>
                            <svg class="mandala-medallion" viewBox="0 0 100 100" fill="none" stroke="var(--gold-bright)" stroke-width="2.5">
                                <rect x="25" y="25" width="50" height="50" rx="8" transform="rotate(45 50 50)" stroke-dasharray="3 3"/>
                                <circle cx="50" cy="50" r="14"/>
                            </svg>
                        </div>

                        <!-- Bottom Structural Panel -->
                        <div class="carved-box square-bottom">
                            <span class="brass-stud stud-tl"></span>
                            <span class="brass-stud stud-tr"></span>
                            <span class="brass-stud stud-bl"></span>
                            <span class="brass-stud stud-br"></span>
                            <svg class="mandala-medallion" viewBox="0 0 100 100" fill="none" stroke="var(--gold-bright)" stroke-width="2">
                                <path d="M50 20 L80 50 L50 80 L20 50 Z" />
                                <circle cx="50" cy="50" r="8"/>
                            </svg>
                        </div>

                    </div>

                    <!-- Brass Pull Handle Left -->
                    <div class="door-handle-assembly">
                        <div class="brass-plate"></div>
                        <div class="door-ring"></div>
                    </div>
                </div>

                <!-- Right Door Wing -->
                <div class="door-leaf right" id="door-right">
                    <div class="wood-texture"></div>
                    <div class="door-panel-artwork">
                        
                        <!-- Top Arch Carving -->
                        <div class="carved-box arch-top">
                            <span class="brass-stud stud-tl"></span>
                            <span class="brass-stud stud-tr"></span>
                            <span class="brass-stud stud-bl"></span>
                            <span class="brass-stud stud-br"></span>

    <!-- ========================================================
         VANILLA JAVASCRIPT: PARTICLES & CINEMATIC LOGIC
         ======================================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            /* ----------------------------------------------------
               1. FLOATING GOLDEN DUST PARTICLES (CANVAS)
               ---------------------------------------------------- */
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let animationFrameId;
            let particleSpeedMultiplier = 1;
            let targetParticleCount = 45;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                if (window.innerWidth < 600) {
                    targetParticleCount = 28; // Optimized for mobile
                } else {
                    targetParticleCount = 55;
                }
            }

            class GoldenParticle {
                constructor() {
                    this.reset(true);
                }

                reset(initial = false) {
                    this.x = Math.random() * canvas.width;
                    this.y = initial ? Math.random() * canvas.height : canvas.height + 15;
                    this.size = Math.random() * 2.2 + 0.8;
                    this.baseSpeedY = Math.random() * 0.45 + 0.2;
                    this.speedX = (Math.random() - 0.5) * 0.35;
                    this.opacity = Math.random() * 0.65 + 0.25;
                    this.pulseSpeed = Math.random() * 0.02 + 0.01;
                    this.pulseVal = Math.random() * Math.PI;
                }

                update() {
                    this.y -= this.baseSpeedY * particleSpeedMultiplier;
                    this.x += this.speedX;
                    this.pulseVal += this.pulseSpeed;

                    // Wrap boundaries
                    if (this.y < -20 || this.x < -20 || this.x > canvas.width + 20) {
                        this.reset(false);
                    }
                }

                draw() {
                    const currentOpacity = this.opacity * (0.65 + Math.sin(this.pulseVal) * 0.35);
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(245, 215, 127, ${currentOpacity})`;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = 'rgba(212, 175, 55, 0.7)';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            function initParticles() {
                resizeCanvas();
                particles = [];
                for (let i = 0; i < targetParticleCount; i++) {
                    particles.push(new GoldenParticle());
                }
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                animationFrameId = requestAnimationFrame(animateParticles);
            }

            window.addEventListener('resize', () => {
                resizeCanvas();
            });

            initParticles();
            animateParticles();

            /* ----------------------------------------------------
               2. DOOR OPENING & CINEMATIC TRANSITION
               ---------------------------------------------------- */
            const btnOpen = document.getElementById('btn-open-invitation');
            const doorsAssembly = document.getElementById('doors-assembly');
            const openingStage = document.getElementById('opening-stage');
            const tempNextSection = document.getElementById('temp-next-section');

            let isOpeningTriggered = false;

            function triggerRoyalDoorOpening() {
                if (isOpeningTriggered) return;
                isOpeningTriggered = true;

                // 1. Disable button interactions
                btnOpen.style.pointerEvents = 'none';
                btnOpen.style.opacity = '0.5';

                // 2. Accelerate ambient gold particles for celebration effect
                particleSpeedMultiplier = 2.4;

                // 3. Initiate Door Swing (CSS 3D transform)
                doorsAssembly.classList.add('is-opening');

                // 4. Subtle camera push forward (zoom) after doors part slightly
                setTimeout(() => {
                    openingStage.classList.add('zoomed-in');
                }, 1000);

                // 5. Smoothly transition to the placeholder screen
                setTimeout(() => {
                    tempNextSection.classList.add('active');
                }, 2200);
            }

            // Click & touch events
            btnOpen.addEventListener('click', triggerRoyalDoorOpening);

            // Optional: Allow direct tapping on the doors themselves to open
            doorsAssembly.addEventListener('click', triggerRoyalDoorOpening);
        });
    </script>
