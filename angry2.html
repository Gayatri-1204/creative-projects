<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maan Jao Na Baby... 🥺❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;1,400&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #3d0717 0%, #1a0108 55%, #080003 100%);
      min-height: 100vh;
      width: 100vw;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 25px 20px;
    }

    /* Ambient Romantic Atmosphere */
    .glow-aura {
      position: absolute;
      width: clamp(300px, 60vw, 550px);
      height: clamp(300px, 60vw, 550px);
      background: radial-gradient(circle, rgba(255, 77, 109, 0.28), transparent 70%);
      filter: blur(90px);
      pointer-events: none;
      z-index: 1;
    }

    .stars-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .twinkle-star {
      position: absolute;
      background: #ffccd5;
      border-radius: 50%;
      animation: twinkle 3s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.6); }
      100% { opacity: 1; transform: scale(1.2); filter: drop-shadow(0 0 6px #ff758f); }
    }

    /* Seamless Stage (No Box, Pure Content) */
    .seamless-stage {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 520px;
    }

    .cursive-subtitle {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.6rem, 5vw, 4rem);
      color: #ff758f;
      text-shadow: 0 0 25px rgba(255, 117, 143, 0.7);
      margin-bottom: -4px;
      letter-spacing: 1px;
    }

    .main-query {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      font-weight: 600;
      color: #ffe5ec;
      text-shadow: 0 4px 18px rgba(0,0,0,0.8);
      margin-bottom: 25px;
    }

    /* Couple Interactive Stage */
    .couple-scene {
      width: clamp(280px, 75vw, 360px);
      height: 220px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    .character-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.7));
    }

    /* Pouting / Turning animations */
    #girlCharacter {
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-origin: 220px 140px;
    }

    #boyCharacter {
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-origin: 140px 140px;
    }

    /* Floating Heart Above Heads */
    .mood-heart {
      position: absolute;
      top: 10px;
      font-size: 2.2rem;
      filter: drop-shadow(0 0 15px rgba(255, 77, 109, 0.8));
      transition: all 0.4s;
    }

    /* Romantic Slider Section */
    .status-text {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.1rem, 2.2vw, 1.35rem);
      color: #ffCCD5;
      min-height: 40px;
      margin-bottom: 18px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .slider-wrapper {
      width: 100%;
      max-width: 360px;
      position: relative;
      margin-bottom: 30px;
    }

    .mood-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 20px;
      background: linear-gradient(90deg, #ff758f, #c9184a, #590d22);
      outline: none;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 77, 109, 0.4);
    }

    .mood-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 40%, #ff4d6d 100%);
      border: 2px solid #fff;
      cursor: pointer;
      box-shadow: 0 0 20px #ff4d6d;
      transition: transform 0.2s ease;
    }

    .mood-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Floating Pill Button */
    .magic-btn {
      background: linear-gradient(135deg, rgba(255, 77, 109, 0.9), rgba(201, 24, 74, 0.9));
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 14px 36px;
      border-radius: 50px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 77, 109, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .magic-btn:hover {
      transform: scale(1.08) translateY(-3px);
      box-shadow: 0 15px 40px rgba(255, 77, 109, 0.7);
    }

    /* Rose Petals & Particle Bursts */
    .particle {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      animation: petalFly 1.8s ease-out forwards;
      z-index: 100;
    }

    @keyframes petalFly {
      0% { opacity: 1; transform: scale(0.6) translate(0, 0) rotate(0deg); }
      100% { opacity: 0; transform: scale(1.8) translate(var(--x), var(--y)) rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="glow-aura"></div>
  <div class="stars-bg" id="starsContainer"></div>

  <div class="seamless-stage">
    
    <div class="cursive-subtitle">Mera pyaara bachha...</div>
    <h1 class="main-query">Sach batao, gussa ho kya? 🥺👉👈</h1>

    <div class="couple-scene">
      <div id="moodHeart" class="mood-heart">💖</div>

      <svg class="character-svg" viewBox="0 0 360 220">
        <!-- Boy Kitten (Left) -->
        <g id="boyCharacter">
          <!-- Ears -->
          <polygon points="90,75 105,35 125,70" fill="#e0afa0" stroke="#4a2810" stroke-width="4"/>
          <polygon points="140,70 160,35 175,75" fill="#e0afa0" stroke="#4a2810" stroke-width="4"/>
          <!-- Body -->
          <ellipse cx="135" cy="160" rx="42" ry="38" fill="#e0afa0" stroke="#4a2810" stroke-width="4"/>
          <!-- Head -->
          <circle cx="135" cy="95" r="42" fill="#e0afa0" stroke="#4a2810" stroke-width="4"/>
          <!-- Pleading Eyes -->
          <ellipse cx="122" cy="92" rx="5" ry="7" fill="#222"/>
          <circle cx="120" cy="89" r="2" fill="#fff"/>
          <ellipse cx="148" cy="92" rx="5" ry="7" fill="#222"/>
          <circle cx="146" cy="89" r="2" fill="#fff"/>
          <!-- Cheeks -->
          <circle cx="112" cy="102" r="8" fill="#ffb4a2" opacity="0.6"/>
          <circle cx="158" cy="102" r="8" fill="#ffb4a2" opacity="0.6"/>
          <!-- Mouth -->
          <path d="M 130 106 Q 135 112 140 106" stroke="#4a2810" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- Paws reaching out to hold hands -->
          <ellipse id="boyPaw" cx="175" cy="140" rx="14" ry="10" fill="#e0afa0" stroke="#4a2810" stroke-width="3"/>
        </g>

        <!-- Girl Kitten (Right - Mood reactive) -->
        <g id="girlCharacter">
          <!-- Ears with Pink Bow -->
          <polygon points="190,75 205,35 225,70" fill="#ffffff" stroke="#333" stroke-width="4"/>
          <polygon points="240,70 260,35 275,75" fill="#ffffff" stroke="#333" stroke-width="4"/>
          <!-- Bow -->
          <circle cx="205" cy="50" r="5" fill="#ff4d6d"/>
          <polygon points="195,45 205,50 195,55" fill="#ff4d6d"/>
          <polygon points="215,45 205,50 215,55" fill="#ff4d6d"/>
          <!-- Body -->
          <ellipse cx="230" cy="160" rx="42" ry="38" fill="#ffffff" stroke="#333" stroke-width="4"/>
          <!-- Head -->
          <circle cx="230" cy="95" r="42" fill="#ffffff" stroke="#333" stroke-width="4"/>
          <!-- Eyes (Changes dynamically) -->
          <g id="girlEyes">
            <ellipse cx="218" cy="92" rx="5" ry="7" fill="#222"/>
            <circle cx="216" cy="89" r="2" fill="#fff"/>
            <ellipse cx="242" cy="92" rx="5" ry="7" fill="#222"/>
            <circle cx="240" cy="89" r="2" fill="#fff"/>
          </g>
          <!-- Cheeks -->
          <circle id="girlBlushL" cx="208" cy="102" r="8" fill="#ff8fa3" opacity="0.7"/>
          <circle id="girlBlushR" cx="252" cy="102" r="8" fill="#ff8fa3" opacity="0.7"/>
          <!-- Mouth (Changes dynamically) -->
          <path id="girlMouth" d="M 226 106 Q 230 112 234 106" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </div>

    <div id="statusDialogue" class="status-text">"Nahi baba, bilkul gussa nahi hoon! 🥰"</div>

    <div class="slider-wrapper">
      <input type="range" id="moodSlider" class="mood-slider" min="0" max="100" value="0" oninput="changeGussaLevel(this.value)">
    </div>

    <button class="magic-btn" onclick="hugAndForgive()">
      <span>Ab maan bhi jao na 🫂🍦</span>
    </button>

  </div>

  <script>
    // Create random twinkling stars in background
    const starsBox = document.getElementById('starsContainer');
    for (let i = 0; i < 45; i++) {
      const star = document.createElement('div');
      star.className = 'twinkle-star';
      star.style.width = Math.random() * 3 + 2 + 'px';
      star.style.height = star.style.width;
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * 100 + 'vh';
      star.style.animationDelay = Math.random() * 3 + 's';
      starsBox.appendChild(star);
    }

    function changeGussaLevel(val) {
      val = parseInt(val);
      const girl = document.getElementById('girlCharacter');
      const boy = document.getElementById('boyCharacter');
      const mouth = document.getElementById('girlMouth');
      const text = document.getElementById('statusDialogue');
      const heart = document.getElementById('moodHeart');
      const blushL = document.getElementById('girlBlushL');
      const blushR = document.getElementById('girlBlushR');

      if (val < 30) {
        // Happy State
        girl.style.transform = 'rotate(0deg) translateX(0px)';
        boy.style.transform = 'rotate(0deg) translateX(0px)';
        mouth.setAttribute('d', 'M 226 106 Q 230 112 234 106');
        text.innerText = `"Nahi baba, bilkul gussa nahi hoon! (${val}%) 🥰"`;
        heart.innerText = '💖';
        blushL.setAttribute('fill', '#ff8fa3');
        blushR.setAttribute('fill', '#ff8fa3');
      } 
      else if (val < 75) {
        // Sulking / Turned back slightly
        girl.style.transform = 'rotate(8deg) translateX(12px)';
        boy.style.transform = 'rotate(5deg) translateX(8px)';
        mouth.setAttribute('d', 'M 225 110 Q 230 104 235 110');
        text.innerText = `"Thoda sa nakhra toh banta hai na! (${val}%) 😤"`;
        heart.innerText = '💔';
      } 
      else {
        // Full Gussa / Face turned away
        girl.style.transform = 'rotate(18deg) translateX(25px)';
        boy.style.transform = 'rotate(8deg) translateX(12px)';
        mouth.setAttribute('d', 'M 224 112 L 236 108');
        text.innerText = `"Jao baat nahi karni tumse! (${val}%) 😾🔥"`;
        heart.innerText = '💢';
        blushL.setAttribute('fill', '#e63946');
        blushR.setAttribute('fill', '#e63946');
      }
    }

    function hugAndForgive() {
      const slider = document.getElementById('moodSlider');
      slider.value = 0;
      changeGussaLevel(0);

      // Cute Snuggle animation
      const girl = document.getElementById('girlCharacter');
      const boy = document.getElementById('boyCharacter');
      girl.style.transform = 'rotate(-10deg) translateX(-20px)';
      boy.style.transform = 'rotate(10deg) translateX(15px)';

      document.getElementById('statusDialogue').innerText = `"Aww, ab maan gayi! Tight wala hug! 🫂❤️✨"`;
      document.getElementById('moodHeart').innerText = '🥰';

      blastFlowersAndHearts();
    }

    function blastFlowersAndHearts() {
      const stage = document.querySelector('.seamless-stage');
      const symbols = ['🌹', '💖', '✨', '🌸', '🫂', '💋'];
      
      for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.innerText = symbols[Math.floor(Math.random() * symbols.length)];
        p.style.fontSize = Math.random() * 1.5 + 1.2 + 'rem';
        
        const x = (Math.random() - 0.5) * 450 + 'px';
        const y = (Math.random() - 0.5) * 350 - 50 + 'px';
        
        p.style.setProperty('--x', x);
        p.style.setProperty('--y', y);
        p.style.left = '50%';
        p.style.top = '40%';
        
        stage.appendChild(p);
        setTimeout(() => p.remove(), 1800);
      }
    }
  </script>
</body>
</html>
