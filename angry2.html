<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Are You Angry At Me? 🥺</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Great+Vibes&family=Montserrat:wght@500;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(ellipse at bottom, #2b040e 0%, #150005 50%, #050002 100%);
      min-height: 100vh;
      width: 100vw;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      padding: 20px 14px;
    }

    .ambient-glow {
      position: absolute;
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, rgba(255, 45, 85, 0.22), transparent 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 117, 143, 0.35);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 30px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7), inset 0 0 20px rgba(255, 77, 109, 0.15);
      position: relative;
      z-index: 10;
    }

    .header-script {
      font-family: 'Great Vibes', cursive;
      font-size: 2.3rem;
      color: #ff758f;
      text-shadow: 0 0 20px rgba(255, 117, 143, 0.6);
      margin-bottom: 4px;
    }

    .title-q {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.3rem, 2.8vw, 1.6rem);
      color: #ffe5ec;
      margin-bottom: 20px;
      font-weight: 700;
    }

    /* Cartoon Stage */
    .character-stage {
      width: 220px;
      height: 200px;
      position: relative;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .cat-avatar {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
      transition: transform 0.3s ease;
    }

    /* Steam animation on max anger */
    .steam-puff {
      position: absolute;
      top: 0;
      font-size: 1.8rem;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .steam-left { left: 20px; }
    .steam-right { right: 20px; }
    .steam-puff.active {
      opacity: 1;
      animation: puffFloat 1.2s ease-in-out infinite alternate;
    }
    @keyframes puffFloat {
      0% { transform: translateY(0px) scale(0.9); }
      100% { transform: translateY(-10px) scale(1.1); }
    }

    /* Status Text */
    .meter-label {
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffccd5;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .anger-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      color: #ff758f;
      min-height: 32px;
      margin-bottom: 18px;
      font-weight: 600;
    }

    /* Slider Container */
    .slider-box {
      width: 100%;
      padding: 0 10px;
      margin-bottom: 24px;
    }

    .anger-range {
      -webkit-appearance: none;
      width: 100%;
      height: 14px;
      border-radius: 10px;
      background: linear-gradient(90deg, #ff8fa3, #ff4d6d, #c9184a, #800f2f);
      outline: none;
      cursor: pointer;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
    }

    .anger-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #ff4d6d;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 77, 109, 0.8);
      transition: transform 0.15s;
    }

    .anger-range::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    /* Calmer Action Button */
    .btn-fix {
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      color: white;
      border: none;
      padding: 13px 30px;
      border-radius: 35px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 77, 109, 0.5);
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-fix:hover {
      transform: scale(1.06);
      box-shadow: 0 12px 30px rgba(255, 77, 109, 0.7);
    }

    /* Floating Hearts */
    .heart-burst {
      position: absolute;
      font-size: 2rem;
      pointer-events: none;
      opacity: 0;
      animation: popHeart 1.5s ease-out forwards;
      z-index: 100;
    }

    @keyframes popHeart {
      0% { opacity: 1; transform: scale(0.5) translate(0, 0); }
      100% { opacity: 0; transform: scale(1.8) translate(var(--dx), var(--dy)); }
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="card">
    <div class="header-script">Honestly tell me...</div>
    <h1 class="title-q">Gussa level kitna hai? 🥺</h1>

    <div class="character-stage">
      <div id="steamL" class="steam-puff steam-left">💨</div>
      <div id="steamR" class="steam-puff steam-right">💨</div>

      <!-- Reactive Cat Avatar SVG -->
      <svg id="catSvg" class="cat-avatar" viewBox="0 0 200 200">
        <!-- Ears -->
        <polygon id="earL" points="40,65 55,20 80,55" fill="#f8edeb" stroke="#333" stroke-width="4"/>
        <polygon id="earR" points="160,65 145,20 120,55" fill="#f8edeb" stroke="#333" stroke-width="4"/>
        <!-- Face -->
        <circle id="face" cx="100" cy="110" r="65" fill="#f8edeb" stroke="#333" stroke-width="4"/>
        <!-- Cheeks Blush -->
        <circle id="blushL" cx="62" cy="120" r="10" fill="#ffb4a2" opacity="0.6"/>
        <circle id="blushR" cx="138" cy="120" r="10" fill="#ffb4a2" opacity="0.6"/>
        <!-- Dynamic Eyebrows -->
        <path id="browL" d="M 65 85 Q 78 85 88 85" stroke="#333" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path id="browR" d="M 135 85 Q 122 85 112 85" stroke="#333" stroke-width="4" stroke-linecap="round" fill="none"/>
        <!-- Eyes -->
        <g id="eyesGroup">
          <ellipse id="eyeL" cx="76" cy="100" rx="6" ry="8" fill="#222"/>
          <ellipse id="eyeR" cx="124" cy="100" rx="6" ry="8" fill="#222"/>
          <circle id="sparkleL" cx="74" cy="97" r="2.5" fill="#fff"/>
          <circle id="sparkleR" cx="122" cy="97" r="2.5" fill="#fff"/>
        </g>
        <!-- Nose -->
        <polygon points="96,112 104,112 100,117" fill="#ff758f"/>
        <!-- Mouth -->
        <path id="mouth" d="M 92 124 Q 100 132 108 124" stroke="#333" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="meter-label">✦ Nakhre Meter ✦</div>
    <div id="angerText" class="anger-text">"Bilkul gussa nahi hoon! (0%) 🥰"</div>

    <div class="slider-box">
      <input type="range" id="angerRange" class="anger-range" min="0" max="100" value="0" oninput="updateMood(this.value)">
    </div>

    <button class="btn-fix" onclick="calmMood()">
      <span>Treat with Ice-cream & Hugs 🍦🫂</span>
    </button>
  </div>

  <script>
    function updateMood(val) {
      val = parseInt(val);
      const face = document.getElementById('face');
      const browL = document.getElementById('browL');
      const browR = document.getElementById('browR');
      const mouth = document.getElementById('mouth');
      const angerText = document.getElementById('angerText');
      const steamL = document.getElementById('steamL');
      const steamR = document.getElementById('steamR');
      const blushL = document.getElementById('blushL');
      const blushR = document.getElementById('blushR');

      if (val < 25) {
        // Happy State
        face.setAttribute('fill', '#f8edeb');
        browL.setAttribute('d', 'M 65 85 Q 75 78 88 85');
        browR.setAttribute('d', 'M 135 85 Q 125 78 112 85');
        mouth.setAttribute('d', 'M 90 122 Q 100 136 110 122');
        angerText.innerText = `"Bilkul gussa nahi hoon! (${val}%) 🥰"`;
        steamL.classList.remove('active');
        steamR.classList.remove('active');
        blushL.setAttribute('fill', '#ffb4a2');
        blushR.setAttribute('fill', '#ffb4a2');
      } 
      else if (val < 70) {
        // Sulking / Pouting State
        face.setAttribute('fill', '#fde2e4');
        browL.setAttribute('d', 'M 65 88 L 88 83');
        browR.setAttribute('d', 'M 135 88 L 112 83');
        mouth.setAttribute('d', 'M 92 128 Q 100 122 108 128');
        angerText.innerText = `"Thoda thoda nakhra chalu hai... (${val}%) 😤"`;
        steamL.classList.remove('active');
        steamR.classList.remove('active');
      } 
      else {
        // Full Angry State (Red face & Steam)
        face.setAttribute('fill', '#ffccd5');
        browL.setAttribute('d', 'M 65 82 L 88 92');
        browR.setAttribute('d', 'M 135 82 L 112 92');
        mouth.setAttribute('d', 'M 90 132 Q 100 120 110 132');
        blushL.setAttribute('fill', '#e63946');
        blushR.setAttribute('fill', '#e63946');
        angerText.innerText = `"Danger zone! Abhi manao mujhe! (${val}%) 😡🔥"`;
        steamL.classList.add('active');
        steamR.classList.add('active');
      }
    }

    function calmMood() {
      const range = document.getElementById('angerRange');
      range.value = 0;
      updateMood(0);

      // Sweet dialogue
      document.getElementById('angerText').innerText = `"Maan gayi! Now give me tight wala hug! 🥰🍦"`;
      blastLoveHearts();
    }

    function blastLoveHearts() {
      const card = document.querySelector('.card');
      for (let i = 0; i < 26; i++) {
        const h = document.createElement('div');
        h.className = 'heart-burst';
        h.innerText = ['❤️', '💖', '🍦', '✨', '🥰', '🌸'][Math.floor(Math.random() * 6)];
        
        const dx = (Math.random() - 0.5) * 450 + 'px';
        const dy = (Math.random() - 0.5) * 380 + 'px';
        
        h.style.setProperty('--dx', dx);
        h.style.setProperty('--dy', dy);
        h.style.left = '50%';
        h.style.top = '40%';
        
        card.appendChild(h);
        setTimeout(() => h.remove(), 1500);
      }
    }
  </script>
</body>
</html>
